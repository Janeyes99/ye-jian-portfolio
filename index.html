ty curve shows why confirmation feedback needs to be tuned rather than simply added.\",\n      cn: \"\\u590D\\u6742\\u5EA6\\u66F2\\u7EBF\\u8BF4\\u660E\\u786E\\u8BA4\\u53CD\\u9988\\u9700\\u8981\\u88AB\\u8C03\\u8282\\uFF0C\\u800C\\u4E0D\\u662F\\u7B80\\u5355\\u53E0\\u52A0\\u3002\"\n    }\n  }]\n}, {\n  id: \"p3\",\n  slug: \"path-tracking-apparatus\",\n  category: \"interaction-mechanisms\",\n  year: \"2023\",\n  featured: true,\n  coverImage: \"assets/portfolio/path/cover.jpg\",\n  tags: {\n    en: [\"Tangible Interaction\", \"Speculative Design\"],\n    cn: [\"\\u5B9E\\u4F53\\u4EA4\\u4E92\", \"\\u601D\\u8FA8\\u8BBE\\u8BA1\"]\n  },\n  title: {\n    en: \"PATH: Perceptive Apparatus for Tracking Humans\",\n    cn: \"PATH：人体追踪感知装置\"\n  },\n  subtitle: {\n    en: \"A tactile apparatus that evaluates computer users through touch, light, and pneumatic surface feedback.\",\n    cn: \"\\u901A\\u8FC7\\u89E6\\u6478\\u3001\\u706F\\u5149\\u4E0E\\u6C14\\u52A8\\u8868\\u9762\\u53CD\\u9988\\u8BC4\\u4F30\\u8BA1\\u7B97\\u673A\\u4F7F\\u7528\\u8005\\u72B6\\u6001\\u7684\\u89E6\\u89C9\\u88C5\\u7F6E\\u3002\"\n  },\n  role: {\n    en: \"Interaction Designer\",\n    cn: \"\\u4EA4\\u4E92\\u8BBE\\u8BA1\\u5E08\"\n  },\n  tools: [\"Physical Computing\", \"Pneumatics\", \"Touch Sensing\"],\n  scores: {\n    screenMatter: 75,\n    practicalExperimental: 90,\n    systemObject: 70,\n    researchCommercial: 5,\n    futureEveryday: 10\n  },\n  links: [{\n    label: {\n      en: \"RCA 2023 Graduate Showcase\",\n      cn: \"RCA 2023 \\u6BD5\\u4E1A\\u5C55\\u9879\\u76EE\\u9875\"\n    },\n    url: \"https://2023.rca.ac.uk/students/ye-jian/\"\n  }],\n  sections: [{\n    title: {\n      en: \"A Tool That Evaluates Its User\",\n      cn: \"\\u8BC4\\u4F30\\u4F7F\\u7528\\u8005\\u7684\\u5DE5\\u5177\"\n    },\n    content: {\n      en: \"PATH reframes internet work as a tactile relationship between a person and a system that continuously evaluates them. By observing touch behavior and translating it into light, color, and surface deformation, the apparatus asks whether the internet remains a tool for people, or whether its users have become tools of the system.\",\n      cn: \"PATH \\u5C06\\u7F51\\u7EDC\\u5DE5\\u4F5C\\u91CD\\u65B0\\u7406\\u89E3\\u4E3A\\u4EBA\\u4E0E\\u7CFB\\u7EDF\\u4E4B\\u95F4\\u6301\\u7EED\\u88AB\\u8BC4\\u4F30\\u7684\\u89E6\\u89C9\\u5173\\u7CFB\\u3002\\u88C5\\u7F6E\\u901A\\u8FC7\\u89C2\\u5BDF\\u89E6\\u6478\\u884C\\u4E3A\\uFF0C\\u5E76\\u5C06\\u5176\\u8F6C\\u8BD1\\u4E3A\\u706F\\u5149\\u3001\\u989C\\u8272\\u4E0E\\u8868\\u9762\\u5F62\\u53D8\\uFF0C\\u8FFD\\u95EE\\u4E92\\u8054\\u7F51\\u7A76\\u7ADF\\u4ECD\\u662F\\u4EBA\\u7684\\u5DE5\\u5177\\uFF0C\\u8FD8\\u662F\\u4F7F\\u7528\\u8005\\u5DF2\\u7ECF\\u6210\\u4E3A\\u7CFB\\u7EDF\\u7684\\u5DE5\\u5177\\u3002\"\n    },\n    fullWidthMedia: true,\n    video: \"assets/portfolio/path/demo.mp4\",\n    images: [{\n      src: \"assets/portfolio/path/intro-followup.jpg\",\n      alt: {\n        en: \"PATH prototype interaction beside the keyboard\",\n        cn: \"PATH \\u539F\\u578B\\u4E0E\\u952E\\u76D8\\u65C1\\u7684\\u4EA4\\u4E92\\u573A\\u666F\"\n      },\n      caption: {\n        en: \"Prototype testing context showing the device beside the keyboard during interaction.\",\n        cn: \"\\u539F\\u578B\\u5728\\u952E\\u76D8\\u65C1\\u7684\\u4EA4\\u4E92\\u6D4B\\u8BD5\\u573A\\u666F\\u3002\"\n      }\n    }],\n    caption: {\n      en: \"Project demo: PATH observes touch behavior and translates it into light and physical feedback.\",\n      cn: \"\\u9879\\u76EE\\u6F14\\u793A\\uFF1APATH \\u89C2\\u5BDF\\u89E6\\u6478\\u884C\\u4E3A\\uFF0C\\u5E76\\u5C06\\u5176\\u8F6C\\u8BD1\\u4E3A\\u706F\\u5149\\u4E0E\\u7269\\u7406\\u53CD\\u9988\\u3002\"\n    }\n  }, {\n    title: {\n      en: \"Literature Supports and Model Tests\",\n      cn: \"文献支持与模型测试\"\n    },\n    content: {\n      en: \"Early research combined literature review, behavior observation, and low-fidelity model testing. These studies helped define which mouse and cursor behaviors could be translated into PATH's sensing and feedback rules.\",\n      cn: \"早期研究结合了文献梳理、行为观察与低保真模型测试。这些材料帮助界定哪些鼠标与光标行为可以被转译为 PATH 的感知与反馈规则。\"\n    },\n    images: [{\n      src: \"assets/portfolio/path/literature-model-test-01.jpg\",\n      alt: {\n        en: \"PATH observation and model test board\",\n        cn: \"PATH 行为观察与模型测试板\"\n      },\n      caption: {\n        en: \"Observation and model testing used to connect mouse behavior with tactile sensing.\",\n        cn: \"通过行为观察与模型测试，将鼠标行为与触觉感知建立联系。\"\n      }\n    }, {\n      src: \"assets/portfolio/path/literature-model-test-02.jpg\",\n      alt: {\n        en: \"PATH literature support notes on mouse movement speed and hesitation\",\n        cn: \"PATH 关于鼠标移动速度与停顿时间的文献支持\"\n      },\n      caption: {\n        en: \"Literature support for movement speed, hesitation pause time, and click frequency.\",\n        cn: \"关于移动速度、停顿时间与点击频率的文献支持。\"\n      }\n    }, {\n      src: \"assets/portfolio/path/literature-model-test-03.jpg\",\n      alt: {\n        en: \"PATH literature support and regression model references\",\n        cn: \"PATH 文献支持与回归模型参考\"\n      },\n      caption: {\n        en: \"Research references linking cursor behavior and keyboard or mouse variables with personality and emotional states.\",\n        cn: \"将光标行为、键鼠变量与人格及情绪状态关联起来的研究参考。\"\n      }\n    }]\n  }, {\n    title: {\n      en: \"Code of Conduct\",\n      cn: \"行为准则\"\n    },\n    content: {\n      en: \"PATH presents its evaluation logic as a code of conduct: movement speed, trajectory, hesitation time, and click frequency become behavioral rules that the apparatus reads and translates into feedback.\",\n      cn: \"PATH 将评估逻辑落实为行为准则：移动速度、轨迹、停顿时间与点击频率成为装置读取并转译为反馈的规则。\"\n    },\n    images: [{\n      src: \"assets/portfolio/path/introduction.png\",\n      alt: {\n        en: \"PATH code of conduct system board\",\n        cn: \"PATH 行为准则系统说明板\"\n      },\n      caption: {\n        en: \"Code of conduct board showing the apparatus composition, manipulation logic, light layer, and behavioral mappings.\",\n        cn: \"行为准则说明板，展示装置构成、操作逻辑、光层与行为映射。\"\n      }\n    }, {\n      src: \"assets/portfolio/path/archive-title.jpg\",\n      alt: {\n        en: \"PATH identity cover and exploded apparatus illustration\",\n        cn: \"PATH 标识封面与爆炸结构图\"\n      },\n      caption: {\n        en: \"Identity cover with the exploded apparatus drawing.\",\n        cn: \"带有爆炸结构图的 PATH 识别封面。\"\n      }\n    }]\n  }, {\n    title: {\n      en: \"Validation Design\",\n      cn: \"验证设计\"\n    },\n    content: {\n      en: \"The validation task combined cursor trajectory, click frequency, touch-zone color, and total task time. These signals were used as a simple behavioral model for translating interaction patterns into a real-time assessment of focus, confidence, and task readiness.\",\n      cn: \"\\u9A8C\\u8BC1\\u4EFB\\u52A1\\u7ED3\\u5408\\u4E86\\u5149\\u6807\\u8F68\\u8FF9\\u3001\\u70B9\\u51FB\\u9891\\u7387\\u3001\\u89E6\\u6478\\u533A\\u57DF\\u989C\\u8272\\u4E0E\\u4EFB\\u52A1\\u603B\\u65F6\\u957F\\uFF0C\\u5C06\\u8FD9\\u4E9B\\u4FE1\\u53F7\\u7EC4\\u6210\\u7B80\\u5316\\u7684\\u884C\\u4E3A\\u6A21\\u578B\\uFF0C\\u7528\\u4E8E\\u628A\\u4EA4\\u4E92\\u6A21\\u5F0F\\u8F6C\\u8BD1\\u4E3A\\u5BF9\\u4E13\\u6CE8\\u5EA6\\u3001\\u4FE1\\u5FC3\\u4E0E\\u4EFB\\u52A1\\u51C6\\u5907\\u72B6\\u6001\\u7684\\u5B9E\\u65F6\\u5224\\u65AD\\u3002\"\n    },\n    images: [{\n      src: \"assets/portfolio/path/validation.png\",\n      alt: {\n        en: \"PATH behavioral validation logic\",\n        cn: \"PATH \\u884C\\u4E3A\\u9A8C\\u8BC1\\u903B\\u8F91\"\n      },\n      caption: {\n        en: \"The original validation diagram combined touch zone, click count, and total time.\",\n        cn: \"\\u539F\\u9A8C\\u8BC1\\u6D41\\u7A0B\\u56FE\\u7ED3\\u5408\\u4E86\\u89E6\\u6478\\u533A\\u57DF\\u3001\\u70B9\\u51FB\\u6B21\\u6570\\u4E0E\\u4EFB\\u52A1\\u603B\\u65F6\\u957F\\u3002\"\n      }\n    }, {\n      src: \"assets/portfolio/path/user-task.png\",\n      alt: {\n        en: \"PATH user task trajectories\",\n        cn: \"PATH \\u7528\\u6237\\u4EFB\\u52A1\\u8F68\\u8FF9\"\n      },\n      caption: {\n        en: \"User task trajectories.\",\n        cn: \"\\u7528\\u6237\\u4EFB\\u52A1\\u8F68\\u8FF9\\u3002\"\n      }\n    }, {\n      src: \"assets/portfolio/path/behavior-map.jpg\",\n      alt: {\n        en: \"PATH coloured touch trajectory map\",\n        cn: \"PATH \\u5F69\\u8272\\u89E6\\u6478\\u8F68\\u8FF9\\u56FE\"\n      },\n      caption: {\n        en: \"Behaviour map showing how trajectory, duration, and route complexity were translated into readable interaction evidence.\",\n        cn: \"\\u884C\\u4E3A\\u56FE\\uFF1A\\u5C06\\u8F68\\u8FF9\\u3001\\u65F6\\u957F\\u4E0E\\u8DEF\\u5F84\\u590D\\u6742\\u5EA6\\u8F6C\\u8BD1\\u4E3A\\u53EF\\u9605\\u8BFB\\u7684\\u4EA4\\u4E92\\u8BC1\\u636E\\u3002\"\n      }\n    }]\n  }, {\n    title: {\n      en: \"Validation Test\",\n      cn: \"验证测试\"\n    },\n    content: {\n      en: \"The validation test collected participant scores, trajectory recordings, screen captures, and post-test comments to evaluate whether PATH's color feedback made users feel monitored and judged.\",\n      cn: \"验证测试汇总了参与者评分、轨迹记录、屏幕录制与测试后反馈，用于评估 PATH 的颜色反馈是否会让用户感到被监测和被评判。\"\n    },\n    image: \"assets/portfolio/path/validation-test.png\",\n    imageAlt: {\n      en: \"PATH validation test participant records and feedback\",\n      cn: \"PATH 验证测试参与者记录与反馈\"\n    },\n    caption: {\n      en: \"Participant validation records with the original green footer removed.\",\n      cn: \"裁掉底部绿色条后的参与者验证测试记录。\"\n    }\n  }, {\n    title: {\n      en: \"Material Test\",\n      cn: \"\\u6750\\u6599\\u6D4B\\u8BD5\"\n    },\n    content: {\n      en: \"Material test documentation records the surface, folding, and prototype-handling experiments behind PATH. These images focus on the tactile construction process before the apparatus became an interactive evaluation object.\",\n      cn: \"\\u6750\\u6599\\u6D4B\\u8BD5\\u8BB0\\u5F55\\u4E86 PATH \\u80CC\\u540E\\u7684\\u8868\\u9762\\u3001\\u6298\\u53E0\\u4E0E\\u539F\\u578B\\u64CD\\u4F5C\\u5B9E\\u9A8C\\u3002\\u8FD9\\u4E24\\u5F20\\u56FE\\u66F4\\u805A\\u7126\\u4E8E\\u88C5\\u7F6E\\u6210\\u4E3A\\u4EA4\\u4E92\\u8BC4\\u4F30\\u7269\\u4EF6\\u4E4B\\u524D\\u7684\\u89E6\\u611F\\u6784\\u9020\\u8FC7\\u7A0B\\u3002\"\n    },\n    images: [{\n      src: \"assets/portfolio/path/material-test-01.jpg\",\n      alt: {\n        en: \"PATH material test sample documentation\",\n        cn: \"PATH \\u6750\\u6599\\u6D4B\\u8BD5\\u6837\\u672C\\u8BB0\\u5F55\"\n      },\n      caption: {\n        en: \"Material test sample documentation.\",\n        cn: \"\\u6750\\u6599\\u6D4B\\u8BD5\\u6837\\u672C\\u8BB0\\u5F55\\u3002\"\n      }\n    }, {\n      src: \"assets/portfolio/path/material-test-02.jpg\",\n      alt: {\n        en: \"PATH material test process documentation\",\n        cn: \"PATH \\u6750\\u6599\\u6D4B\\u8BD5\\u8FC7\\u7A0B\\u8BB0\\u5F55\"\n      },\n      caption: {\n        en: \"Material test process documentation.\",\n        cn: \"\\u6750\\u6599\\u6D4B\\u8BD5\\u8FC7\\u7A0B\\u8BB0\\u5F55\\u3002\"\n      }\n    }]\n  }, {\n    title: {\n      en: \"Additional Touch Study\",\n      cn: \"\\u8865\\u5145\\u89E6\\u6478\\u7814\\u7A76\"\n    },\n    content: {\n      en: \"Two short motion studies document how touch interaction changes the light response: holding the surface produces a sustained color shift, while repeated clicking creates a smaller, pulsing color variation.\",\n      cn: \"\\u4E24\\u6BB5\\u52A8\\u6001\\u7814\\u7A76\\u8BB0\\u5F55\\u4E86\\u89E6\\u6478\\u4EA4\\u4E92\\u5982\\u4F55\\u6539\\u53D8\\u706F\\u5149\\u53CD\\u9988\\uFF1A\\u6309\\u4F4F\\u8868\\u9762\\u4F1A\\u4EA7\\u751F\\u6301\\u7EED\\u7684\\u989C\\u8272\\u53D8\\u5316\\uFF0C\\u800C\\u8FDE\\u7EED\\u70B9\\u51FB\\u5219\\u5F62\\u6210\\u66F4\\u5C0F\\u7684\\u8109\\u51B2\\u5F0F\\u53D8\\u8272\\u3002\"\n    },\n    videos: [{\n      src: \"assets/portfolio/path/touch-hold-color.mp4\",\n      caption: {\n        en: \"Holding touch: sustained color change.\",\n        cn: \"\\u6309\\u4F4F\\u89E6\\u6478\\uFF1A\\u6301\\u7EED\\u53D8\\u8272\\u3002\"\n      }\n    }, {\n      src: \"assets/portfolio/path/touch-click-color.mp4\",\n      caption: {\n        en: \"Clicking touch: smaller pulsing color change.\",\n        cn: \"\\u70B9\\u51FB\\u89E6\\u6478\\uFF1A\\u5C0F\\u5E45\\u8109\\u51B2\\u53D8\\u8272\\u3002\"\n      }\n    }]\n  }]\n}, {\n  id: \"p4\",\n  slug: \"tri-eco-service\",\n  category: \"service-brand\",\n  year: \"2022\",\n  featured: true,\n  coverImage: \"assets/portfolio/tri-eco-service/cover.jpg\",\n  tags: {\n    en: [\"Service Design\", \"Circular Economy\", \"E-waste\"],\n    cn: [\"\\u670D\\u52A1\\u8BBE\\u8BA1\", \"\\u5FAA\\u73AF\\u7ECF\\u6D4E\", \"\\u7535\\u5B50\\u5E9F\\u5F03\\u7269\"]\n  },\n  title: {\n    en: \"Tri\\u2013Eco\",\n    cn: \"三重生态\"\n  },\n  subtitle: {\n    en: \"A community workshop system that reconnects residents with electronics recycling through hands-on making.\",\n    cn: \"\\u901A\\u8FC7\\u793E\\u533A\\u5DE5\\u4F5C\\u574A\\u548C\\u52A8\\u624B\\u518D\\u5236\\u9020\\uFF0C\\u628A\\u5C45\\u6C11\\u91CD\\u65B0\\u8FDE\\u63A5\\u8FDB\\u7535\\u5B50\\u4EA7\\u54C1\\u56DE\\u6536\\u7CFB\\u7EDF\\u3002\"\n  },\n  role: {\n    en: \"Service Experience Designer\",\n    cn: \"\\u670D\\u52A1\\u4F53\\u9A8C\\u8BBE\\u8BA1\\u5E08\"\n  },\n  tools: [\"Service Blueprint\", \"Field Research\", \"Circular Workshop\"],\n  scores: {\n    screenMatter: 50,\n    practicalExperimental: 60,\n    systemObject: 20\n  },\n  sections: [{\n    title: {\n      en: \"Existing Recycling System\",\n      cn: \"\\u73B0\\u6709\\u56DE\\u6536\\u7CFB\\u7EDF\"\n    },\n    content: {\n      en: \"Tri\\u2013Eco was developed for OPPO \\xD7 RCA 2022: Beyond Smart. The project begins with a disconnect in the electronics lifecycle: valuable materials move through repair, reuse, refurbishment, and recycling systems, while users have little visibility into where discarded devices go or how their value is recovered.\",\n      cn: \"“三重生态”来自 OPPO × RCA 2022「Beyond Smart」课题。项目从电子产品生命周期中的断裂出发：有价值的材料会进入维修、再利用、翻新与回收系统，但用户往往看不到废旧设备最终去了哪里，也很难理解其中的价值如何被重新利用。\"\n    },\n    image: \"assets/portfolio/tri-eco-service/pdf-pages/page-1.png\",\n    imageAlt: {\n      en: \"Diagram of the existing electronics lifecycle and recycling system\",\n      cn: \"\\u73B0\\u6709\\u7535\\u5B50\\u4EA7\\u54C1\\u751F\\u547D\\u5468\\u671F\\u4E0E\\u56DE\\u6536\\u7CFB\\u7EDF\\u56FE\"\n    },\n    caption: {\n      en: \"The existing system distributes responsibility across manufacturers, service providers, collection points, and users.\",\n      cn: \"\\u73B0\\u6709\\u7CFB\\u7EDF\\u5C06\\u8D23\\u4EFB\\u5206\\u6563\\u5728\\u6750\\u6599\\u4E0E\\u96F6\\u4EF6\\u5236\\u9020\\u5546\\u3001\\u4EA7\\u54C1\\u5236\\u9020\\u5546\\u3001\\u670D\\u52A1\\u5546\\u3001\\u56DE\\u6536\\u70B9\\u548C\\u7528\\u6237\\u4E4B\\u95F4\\u3002\"\n    },\n    annotations: {\n      en: [\n        \"E-waste contains an estimated $57 million in recoverable raw-material value.\",\n        \"More than 80% of users leave old phones unused at home.\",\n        \"The smartphone waste stream was visualized as equivalent to roughly 300,000 buses.\"\n      ],\n      cn: [\n        \"\\u7535\\u5B50\\u5E9F\\u5F03\\u7269\\u4E2D\\u8574\\u542B\\u7EA6 5700 \\u4E07\\u7F8E\\u5143\\u7684\\u53EF\\u56DE\\u6536\\u539F\\u6750\\u6599\\u4EF7\\u503C\\u3002\",\n        \"\\u8D85\\u8FC7 80% \\u7684\\u7528\\u6237\\u4F1A\\u5C06\\u65E7\\u624B\\u673A\\u95F2\\u7F6E\\u5728\\u5BB6\\u4E2D\\u3002\",\n        \"\\u667A\\u80FD\\u624B\\u673A\\u53CA\\u7C7B\\u4F3C\\u8BBE\\u5907\\u4EA7\\u751F\\u7684\\u5E9F\\u7269\\u6D41\\u89C4\\u6A21\\uFF0C\\u88AB\\u6362\\u7B97\\u4E3A\\u7EA6 30 \\u4E07\\u8F86\\u516C\\u4EA4\\u8F66\\u3002\"\n      ]\n    }\n  }, {\n    title: {\n      en: \"Field Research at SWEEEP\",\n      cn: \"SWEEEP \\u7530\\u91CE\\u8C03\\u67E5\"\n    },\n    content: {\n      en: \"Field research at SWEEEP Kuusakoski followed electronics from collection through manual sorting, shredding, and material separation. The visit revealed a highly capable industrial process, but also a participation gap: residents remain distant from the system, its material value, and its environmental consequences.\",\n      cn: \"\\u5728 SWEEEP Kuusakoski \\u7684\\u7530\\u91CE\\u8C03\\u67E5\\u4E2D\\uFF0C\\u56E2\\u961F\\u8FFD\\u8E2A\\u4E86\\u7535\\u5B50\\u4EA7\\u54C1\\u4ECE\\u6536\\u96C6\\u3001\\u4EBA\\u5DE5\\u5206\\u62E3\\u5230\\u7C89\\u788E\\u548C\\u6750\\u6599\\u5206\\u79BB\\u7684\\u5B8C\\u6574\\u6D41\\u7A0B\\u3002\\u5DE5\\u5382\\u5177\\u5907\\u6210\\u719F\\u7684\\u5DE5\\u4E1A\\u5904\\u7406\\u80FD\\u529B\\uFF0C\\u4F46\\u540C\\u65F6\\u66B4\\u9732\\u51FA\\u53C2\\u4E0E\\u65AD\\u5C42\\uFF1A\\u5C45\\u6C11\\u4E0E\\u56DE\\u6536\\u7CFB\\u7EDF\\u3001\\u6750\\u6599\\u4EF7\\u503C\\u4EE5\\u53CA\\u73AF\\u5883\\u540E\\u679C\\u4E4B\\u95F4\\u4ECD\\u7136\\u8DDD\\u79BB\\u5F88\\u8FDC\\u3002\"\n    },\n    video: \"assets/portfolio/tri-eco-service/cover.jpg\",\n    image: \"assets/portfolio/tri-eco-service/pdf-pages/page-2.png\",\n    imageAlt: {\n      en: \"Electronic recycling flow, industrial process, and stakeholder model\",\n      cn: \"\\u7535\\u5B50\\u56DE\\u6536\\u6D41\\u7A0B\\u3001\\u5DE5\\u4E1A\\u5904\\u7406\\u8FC7\\u7A0B\\u4E0E\\u5229\\u76CA\\u76F8\\u5173\\u8005\\u6A21\\u578B\"\n    },\n    caption: {\n      en: \"The research mapped both the physical treatment process and the service relationships surrounding it.\",\n      cn: \"\\u8C03\\u7814\\u540C\\u65F6\\u68B3\\u7406\\u4E86\\u5E9F\\u5F03\\u7269\\u7684\\u7269\\u7406\\u5904\\u7406\\u6D41\\u7A0B\\uFF0C\\u4EE5\\u53CA\\u56F4\\u7ED5\\u56DE\\u6536\\u5DE5\\u5382\\u5F62\\u6210\\u7684\\u670D\\u52A1\\u5173\\u7CFB\\u3002\"\n    },\n    annotations: {\n      en: [\n        \"The observed process moved from manual sorting to shredding and separation.\",\n        \"Low recycling rates are tied to weak public participation, not only processing capacity.\",\n        \"Transparency and human and environmental safety became central design concerns.\"\n      ],\n      cn: [\n        \"\\u73B0\\u573A\\u6D41\\u7A0B\\u7531\\u4EBA\\u5DE5\\u5206\\u62E3\\u8FDB\\u5165\\u7C89\\u788E\\u4E0E\\u6750\\u6599\\u5206\\u79BB\\u3002\",\n        \"\\u4F4E\\u56DE\\u6536\\u7387\\u4E0D\\u4EC5\\u662F\\u5904\\u7406\\u80FD\\u529B\\u95EE\\u9898\\uFF0C\\u4E5F\\u4E0E\\u516C\\u4F17\\u53C2\\u4E0E\\u4E0D\\u8DB3\\u6709\\u5173\\u3002\",\n        \"\\u6D41\\u7A0B\\u900F\\u660E\\u5EA6\\u4EE5\\u53CA\\u4EBA\\u4E0E\\u73AF\\u5883\\u7684\\u5B89\\u5168\\uFF0C\\u6210\\u4E3A\\u540E\\u7EED\\u8BBE\\u8BA1\\u7684\\u6838\\u5FC3\\u5173\\u6CE8\\u70B9\\u3002\"\n      ]\n    }\n  }, {\n    title: {\n      en: \"Rebuilding Participation\",\n      cn: \"\\u91CD\\u5EFA\\u53C2\\u4E0E\\u65B9\\u5F0F\"\n    },\n    content: {\n      en: \"The design concept introduces a community-based workshop near recycling centres. Instead of treating residents only as the final source of waste, the service invites them to participate in disassembly and remaking. Community, engagement, and making become the three values that reconnect users with the material lifecycle.\",\n      cn: \"\\u8BBE\\u8BA1\\u6982\\u5FF5\\u662F\\u5728\\u56DE\\u6536\\u4E2D\\u5FC3\\u9644\\u8FD1\\u5EFA\\u7ACB\\u793E\\u533A\\u5DE5\\u4F5C\\u574A\\u3002\\u670D\\u52A1\\u4E0D\\u518D\\u628A\\u5C45\\u6C11\\u4EC5\\u4EC5\\u89C6\\u4E3A\\u5E9F\\u5F03\\u7269\\u7684\\u6765\\u6E90\\uFF0C\\u800C\\u662F\\u9080\\u8BF7\\u4ED6\\u4EEC\\u53C2\\u4E0E\\u62C6\\u89E3\\u4E0E\\u518D\\u5236\\u9020\\u3002\\u793E\\u533A\\u3001\\u53C2\\u4E0E\\u548C\\u52A8\\u624B\\u5236\\u4F5C\\u6210\\u4E3A\\u91CD\\u65B0\\u8FDE\\u63A5\\u7528\\u6237\\u4E0E\\u6750\\u6599\\u751F\\u547D\\u5468\\u671F\\u7684\\u4E09\\u4E2A\\u6838\\u5FC3\\u4EF7\\u503C\\u3002\"\n    },\n    image: \"assets/portfolio/tri-eco-service/pdf-pages/page-3.png\",\n    imageAlt: {\n      en: \"Tri\\u2013Eco redesigned lifecycle with a community workshop loop\",\n      cn: \"加入社区工作坊循环后的 “三重生态” 生命周期\"\n    },\n    caption: {\n      en: \"Reusable products made by residents and recyclable materials re-enter the lifecycle through separate paths.\",\n      cn: \"\\u5C45\\u6C11\\u5236\\u4F5C\\u7684\\u53EF\\u91CD\\u590D\\u4F7F\\u7528\\u4EA7\\u54C1\\u4E0E\\u53EF\\u56DE\\u6536\\u6750\\u6599\\uFF0C\\u901A\\u8FC7\\u4E0D\\u540C\\u8DEF\\u5F84\\u91CD\\u65B0\\u8FDB\\u5165\\u751F\\u547D\\u5468\\u671F\\u3002\"\n    },\n    annotations: {\n      en: [\n        \"Target users are residents in local communities near recycling centres.\",\n        \"The workshop changes how users participate in recycling rather than only adding another collection point.\",\n        \"The service loop links recovery, practical learning, and a visible personal return.\"\n      ],\n      cn: [\n        \"\\u76EE\\u6807\\u7528\\u6237\\u662F\\u5C45\\u4F4F\\u5728\\u56DE\\u6536\\u4E2D\\u5FC3\\u9644\\u8FD1\\u7684\\u793E\\u533A\\u5C45\\u6C11\\u3002\",\n        \"\\u5DE5\\u4F5C\\u574A\\u6539\\u53D8\\u7684\\u662F\\u7528\\u6237\\u53C2\\u4E0E\\u56DE\\u6536\\u7684\\u65B9\\u5F0F\\uFF0C\\u800C\\u4E0D\\u53EA\\u662F\\u589E\\u52A0\\u4E00\\u4E2A\\u65B0\\u7684\\u56DE\\u6536\\u70B9\\u3002\",\n        \"\\u670D\\u52A1\\u95ED\\u73AF\\u8FDE\\u63A5\\u6750\\u6599\\u56DE\\u6536\\u3001\\u5B9E\\u8DF5\\u5B66\\u4E60\\u4E0E\\u53EF\\u89C1\\u7684\\u4E2A\\u4EBA\\u56DE\\u62A5\\u3002\"\n      ]\n    }\n  }, {\n    title: {\n      en: \"From E-Waste to Community Making\",\n      cn: \"\\u4ECE\\u7535\\u5B50\\u5E9F\\u5F03\\u7269\\u5230\\u793E\\u533A\\u518D\\u9020\"\n    },\n    content: {\n      en: \"Residents bring unused electronics to a local workshop, where technicians support safe disassembly and material separation. Valuable metals return to the recycling stream, while leftover plastics become material for small remaking activities. The object made in the workshop acts as a tangible incentive and makes the value of recycling personally legible.\",\n      cn: \"\\u5C45\\u6C11\\u5C06\\u95F2\\u7F6E\\u7535\\u5B50\\u4EA7\\u54C1\\u5E26\\u5230\\u672C\\u5730\\u5DE5\\u4F5C\\u574A\\uFF0C\\u5728\\u6280\\u672F\\u4EBA\\u5458\\u534F\\u52A9\\u4E0B\\u5B89\\u5168\\u62C6\\u89E3\\u5E76\\u5206\\u79BB\\u6750\\u6599\\u3002\\u6709\\u4EF7\\u503C\\u7684\\u91D1\\u5C5E\\u91CD\\u65B0\\u8FDB\\u5165\\u56DE\\u6536\\u6D41\\u7A0B\\uFF0C\\u5269\\u4F59\\u5851\\u6599\\u5219\\u6210\\u4E3A\\u5C0F\\u578B\\u518D\\u5236\\u9020\\u6D3B\\u52A8\\u7684\\u6750\\u6599\\u3002\\u53C2\\u4E0E\\u8005\\u6700\\u7EC8\\u5E26\\u8D70\\u7684\\u7269\\u4EF6\\u65E2\\u662F\\u6FC0\\u52B1\\uFF0C\\u4E5F\\u8BA9\\u56DE\\u6536\\u4EF7\\u503C\\u53D8\\u5F97\\u5177\\u4F53\\u53EF\\u611F\\u3002\"\n    },\n    image: \"assets/portfolio/tri-eco-service/pdf-pages/page-4.png\",\n    imageAlt: {\n      en: \"Storyboard of the Tri\\u2013Eco community workshop journey\",\n      cn: \"“三重生态” 社区工作坊服务旅程故事板\"\n    },\n    caption: {\n      en: \"The storyboard turns the proposed service into a repeatable journey from community invitation to material remaking.\",\n      cn: \"\\u6545\\u4E8B\\u677F\\u5C06\\u670D\\u52A1\\u63D0\\u6848\\u8F6C\\u5316\\u4E3A\\u4E00\\u6761\\u53EF\\u91CD\\u590D\\u7684\\u65C5\\u7A0B\\uFF1A\\u4ECE\\u793E\\u533A\\u9080\\u8BF7\\uFF0C\\u5230\\u62C6\\u89E3\\u3001\\u5206\\u6D41\\u4E0E\\u6750\\u6599\\u518D\\u9020\\u3002\"\n    },\n    annotations: {\n      en: [\n        \"Plastic accounts for roughly 20% of the 50 million tonnes of e-waste produced each year.\",\n        \"Technicians support safe disassembly while residents remain active participants.\",\n        \"The remade object makes the outcome of recycling visible and personally meaningful.\"\n      ],\n      cn: [\n        \"\\u5851\\u6599\\u7EA6\\u5360\\u6BCF\\u5E74 5000 \\u4E07\\u5428\\u7535\\u5B50\\u5E9F\\u5F03\\u7269\\u7684 20%\\u3002\",\n        \"\\u6280\\u672F\\u4EBA\\u5458\\u8D1F\\u8D23\\u5B89\\u5168\\u652F\\u6301\\uFF0C\\u5C45\\u6C11\\u4ECD\\u7136\\u662F\\u4E3B\\u52A8\\u53C2\\u4E0E\\u8005\\u3002\",\n        \"\\u518D\\u5236\\u9020\\u7269\\u4EF6\\u8BA9\\u56DE\\u6536\\u7ED3\\u679C\\u53D8\\u5F97\\u53EF\\u89C1\\uFF0C\\u4E5F\\u4E0E\\u4E2A\\u4EBA\\u4EA7\\u751F\\u76F4\\u63A5\\u8054\\u7CFB\\u3002\"\n      ]\n    }\n  }, {\n    title: {\n      en: \"Future Plan\",\n      cn: \"\\u540E\\u7EED\\u8BA1\\u5212\"\n    },\n    content: {\n      en: \"The proposed next phase combines material experiments, collaboration with recycling factories, and a win\\u2013win service model for residents, recyclers, and partner factories. Before running the workshop, the team would test accessible remaking methods and prepare the equipment needed for small-scale plastic processing.\",\n      cn: \"\\u4E0B\\u4E00\\u9636\\u6BB5\\u5C06\\u6750\\u6599\\u5B9E\\u9A8C\\u3001\\u4E0E\\u56DE\\u6536\\u5DE5\\u5382\\u7684\\u534F\\u4F5C\\uFF0C\\u4EE5\\u53CA\\u5C45\\u6C11\\u3001\\u56DE\\u6536\\u65B9\\u548C\\u5408\\u4F5C\\u5DE5\\u5382\\u4E4B\\u95F4\\u7684\\u5171\\u8D62\\u670D\\u52A1\\u6A21\\u5F0F\\u7ED3\\u5408\\u8D77\\u6765\\u3002\\u5728\\u5DE5\\u4F5C\\u574A\\u843D\\u5730\\u524D\\uFF0C\\u9700\\u8981\\u6D4B\\u8BD5\\u6613\\u4E8E\\u53C2\\u4E0E\\u7684\\u518D\\u5236\\u9020\\u65B9\\u6CD5\\uFF0C\\u5E76\\u51C6\\u5907\\u5C0F\\u89C4\\u6A21\\u5851\\u6599\\u52A0\\u5DE5\\u6240\\u9700\\u7684\\u8BBE\\u5907\\u3002\"\n    },\n    image: \"assets/portfolio/tri-eco-service/pdf-pages/page-5.png\",\n    imageAlt: {\n      en: \"Tri\\u2013Eco future plan and required equipment\",\n      cn: \"“三重生态” 后续计划与所需设备\"\n    },\n    caption: {\n      en: \"The plan identifies three next steps and the basic tools required to test a community remaking workshop.\",\n      cn: \"\\u8BA1\\u5212\\u660E\\u786E\\u4E86\\u4E09\\u4E2A\\u540E\\u7EED\\u6B65\\u9AA4\\uFF0C\\u4EE5\\u53CA\\u6D4B\\u8BD5\\u793E\\u533A\\u518D\\u5236\\u9020\\u5DE5\\u4F5C\\u574A\\u6240\\u9700\\u7684\\u57FA\\u7840\\u5DE5\\u5177\\u3002\"\n    },\n    annotations: {\n      en: [\n        \"Run material experiments for short, accessible workshop activities.\",\n        \"Coordinate the future workshop with recycling factories.\",\n        \"Test a shared-value model among residents, recyclers, and factories.\"\n      ],\n      cn: [\n        \"\\u5F00\\u5C55\\u9002\\u5408\\u77ED\\u65F6\\u3001\\u4F4E\\u95E8\\u69DB\\u5DE5\\u4F5C\\u574A\\u7684\\u6750\\u6599\\u5B9E\\u9A8C\\u3002\",\n        \"\\u4E0E\\u56DE\\u6536\\u5DE5\\u5382\\u534F\\u8C03\\u672A\\u6765\\u5DE5\\u4F5C\\u574A\\u7684\\u8FD0\\u884C\\u65B9\\u5F0F\\u3002\",\n        \"\\u6D4B\\u8BD5\\u5C45\\u6C11\\u3001\\u56DE\\u6536\\u65B9\\u548C\\u5DE5\\u5382\\u4E4B\\u95F4\\u7684\\u5171\\u4EAB\\u4EF7\\u503C\\u6A21\\u5F0F\\u3002\"\n      ]\n    }\n  }]\n}, {\n  id: \"p5\",\n  slug: \"coins-in-the-sky\",\n  category: \"installations\",\n  year: \"2023\",\n  featured: false,\n  coverImage: \"assets/portfolio/coins-in-the-sky/cover.png\",\n  tags: {\n    en: [\"Installation\", \"Work-in-progress Show\", \"Labour Feedback\"],\n    cn: [\"\\u4EA4\\u4E92\\u88C5\\u7F6E\", \"\\u9636\\u6BB5\\u5C55\", \"\\u52B3\\u52A8\\u53CD\\u9988\"]\n  },\n  title: {\n    en: \"Coins in the Sky\",\n    cn: \"空中硬币\"\n  },\n  subtitle: {\n    en: \"Coins in the Sky turns workplace feedback and promised rewards into a physical game of typing speed, falling coins, and uneven return.\",\n    cn: \"Coins in the Sky 将职场反馈与回报承诺转化为实体游戏体验：打字速度驱动硬币下落，也让投入、竞争与不均衡回报变得可见。\"\n  },\n  role: {\n    en: \"Installation Designer\",\n    cn: \"\\u88C5\\u7F6E\\u8BBE\\u8BA1\\u5E08\"\n  },\n  tools: [\"Physical Installation\", \"Game Mechanism\", \"Exhibition Setup\"],\n  scores: {\n    screenMatter: 90,\n    practicalExperimental: 90,\n    systemObject: 85\n  },\n  links: [{\n    label: {\n      en: \"RCA 2023 Graduate Showcase\",\n      cn: \"RCA 2023 \\u6BD5\\u4E1A\\u5C55\\u9879\\u76EE\\u9875\"\n    },\n    url: \"https://2023.rca.ac.uk/students/ye-jian/\"\n  }],\n  sections: [{\n    title: {\n      en: \"Interaction Demonstration\",\n      cn: \"\\u4EA4\\u4E92\\u6F14\\u793A\"\n    },\n    content: {\n      en: \"The installation turns typing speed into a physical competition. Players type on keyboards to affect the movement and distribution of coins, making feedback, effort, and return visible through the game device.\",\n      cn: \"\\u88C5\\u7F6E\\u5C06\\u6253\\u5B57\\u901F\\u5EA6\\u8F6C\\u5316\\u4E3A\\u5B9E\\u4F53\\u7ADE\\u4E89\\u3002\\u73A9\\u5BB6\\u901A\\u8FC7\\u952E\\u76D8\\u8F93\\u5165\\u5F71\\u54CD\\u786C\\u5E01\\u7684\\u8FD0\\u52A8\\u548C\\u5206\\u914D\\uFF0C\\u8BA9\\u53CD\\u9988\\u3001\\u6295\\u5165\\u4E0E\\u56DE\\u62A5\\u4E4B\\u95F4\\u7684\\u5173\\u7CFB\\u901A\\u8FC7\\u6E38\\u620F\\u88C5\\u7F6E\\u53D8\\u5F97\\u53EF\\u89C1\\u3002\"\n    },\n    image: \"assets/portfolio/coins-in-the-sky/cover.png\",\n    imageAlt: {\n      en: \"Coins in the Sky interaction demonstration\",\n      cn: \"“空中硬币”交互演示\"\n    },\n    caption: {\n      en: \"Interaction documentation from the project archive.\",\n      cn: \"\\u9879\\u76EE\\u6863\\u6848\\u4E2D\\u7684\\u4EA4\\u4E92\\u8BB0\\u5F55\\u3002\"\n    }\n  }, {\n    title: {\n      en: \"About\",\n      cn: \"\\u9879\\u76EE\\u80CC\\u666F\"\n    },\n    content: {\n      en: \"The project starts from a workplace tension: feedback is treated as a tool for growth, goal setting, and performance evaluation, yet it often becomes unevenly distributed and tied to competition. Coins in the Sky uses the language of gambling chips and promised return to make that feedback economy physical. Typing becomes labor input, coins become visible reward, and the device exposes how workers can be pushed to invest more in pursuit of uncertain recognition.\",\n      cn: \"项目从职场反馈中的矛盾出发：反馈被视为成长、目标设定与绩效评估的工具，却常常分配不均，并与竞争关系绑定。Coins in the Sky 借用筹码与回报承诺的语言，将这种反馈经济转化为实体体验。打字成为劳动投入，硬币成为可见回报，装置也揭示了工作者如何被推动着继续投入，以追逐并不确定的认可。\"\n    },\n    image: \"assets/portfolio/coins-in-the-sky/interaction-photos.png\",\n    imageAlt: {\n      en: \"Coins in the Sky installation documentation\",\n      cn: \"“空中硬币”装置记录\"\n    },\n    caption: {\n      en: \"Installation views and interaction documentation extracted from the original project board.\",\n      cn: \"\\u4ECE\\u539F\\u9879\\u76EE\\u957F\\u56FE\\u4E2D\\u6574\\u7406\\u51FA\\u7684\\u88C5\\u7F6E\\u89C6\\u56FE\\u4E0E\\u4EA4\\u4E92\\u8BB0\\u5F55\\u3002\"\n    }\n  }, {\n    title: {\n      en: \"Coins in the Sky\",\n      cn: \"空中硬币\"\n    },\n    content: {\n      en: \"The work draws on the \\u201Cpie in the sky\\u201D effect, where people keep investing effort because future reward still feels possible. The installation stages feedback as a game relationship between coworkers, supervisors, employees, and organizations. Faster typing releases more coins and shifts the pointer toward the faster player, turning workplace metrics into visible competition and showing how promised return can become unstable, biased, and hard to claim.\",\n      cn: \"作品借用了“pie in the sky”效应：人们会因为未来回报看似仍然可能，而持续投入劳动。装置将同事、主管、员工与组织之间的反馈关系转化为游戏机制。更快的打字速度会释放更多硬币，并让指针偏向速度更快的玩家；职场指标由此变成可见的竞争，也显露出回报承诺如何变得不稳定、有偏向，并且难以真正获得。\"\n    },\n    image: \"assets/portfolio/coins-in-the-sky/cover.png\",\n    imageAlt: {\n      en: \"Coins in the Sky physical game device\",\n      cn: \"“空中硬币”实体游戏装置\"\n    },\n    caption: {\n      en: \"The physical game device visualises feedback through coins, typing speed, and competitive input.\",\n      cn: \"\\u5B9E\\u4F53\\u6E38\\u620F\\u88C5\\u7F6E\\u901A\\u8FC7\\u786C\\u5E01\\u3001\\u8F93\\u5165\\u901F\\u5EA6\\u4E0E\\u7ADE\\u4E89\\u6027\\u64CD\\u4F5C\\u5448\\u73B0\\u53CD\\u9988\\u5173\\u7CFB\\u3002\"\n    }\n  }, {\n    title: {\n      en: \"Game Mechanism\",\n      cn: \"\\u6E38\\u620F\\u673A\\u5236\"\n    },\n    content: {\n      en: \"The installation uses input speed, falling coins, and a shifting directional pointer to turn workplace feedback into a competitive physical system. The game visualises how more effort can produce more visible feedback while also making distribution unstable when multiple players compete for the same return.\",\n      cn: \"装置通过输入速度、下落硬币和会偏转的方向指针，把职场反馈转化为竞争性的实体系统。它让“更多努力换来更多可见反馈”的逻辑变得可见，同时也展示了当多名玩家竞争同一回报时，分配如何变得不稳定。\"\n    },\n    image: \"assets/portfolio/coins-in-the-sky/board.png\",\n    imageAlt: {\n      en: \"Coins in the Sky original presentation board\",\n      cn: \"“空中硬币”原始项目长图\"\n    },\n    caption: {\n      en: \"Original presentation board showing the concept, interaction rules, and exhibition context.\",\n      cn: \"\\u539F\\u59CB\\u5C55\\u793A\\u677F\\u8BB0\\u5F55\\u4E86\\u9879\\u76EE\\u6982\\u5FF5\\u3001\\u4EA4\\u4E92\\u89C4\\u5219\\u4E0E\\u5C55\\u51FA\\u8BED\\u5883\\u3002\"\n    }\n  }, {\n    title: {\n      en: \"Open Studios Presentation\",\n      cn: \"开放工作室展示\"\n    },\n    content: {\n      en: \"Coins in the Sky was shown at Open Studios: Work-in-progress Show 2023 at the Royal College of Art in London. The installation connects typing, coin movement, and competitive play into a physical feedback system about promised returns and delayed reward.\",\n      cn: \"\\u201C\\u7A7A\\u4E2D\\u786C\\u5E01\\u201D\\u5C55\\u51FA\\u4E8E\\u4F26\\u6566\\u7687\\u5BB6\\u827A\\u672F\\u5B66\\u9662 Open Studios: Work-in-progress Show 2023\\u3002\\u88C5\\u7F6E\\u901A\\u8FC7\\u6253\\u5B57\\u8F93\\u5165\\u3001\\u786C\\u5E01\\u8FD0\\u52A8\\u4E0E\\u53CC\\u4EBA\\u7ADE\\u4E89\\uFF0C\\u628A\\u5173\\u4E8E\\u56DE\\u62A5\\u627F\\u8BFA\\u548C\\u5EF6\\u8FDF\\u53CD\\u9988\\u7684\\u5173\\u7CFB\\u8F6C\\u5316\\u4E3A\\u53EF\\u89C1\\u7684\\u4E92\\u52A8\\u7CFB\\u7EDF\\u3002\"\n    }\n  }]\n}, {\n  id: \"p6\",\n  slug: \"artificial-sky\",\n  category: \"installations\",\n  year: \"2023\",\n  featured: false,\n  coverImage: \"assets/portfolio/artificial-sky/cover.jpg\",\n  tags: {\n    en: [\"Installation\", \"Light Atmosphere\", \"Collaborative Project\"],\n    cn: [\"\\u4EA4\\u4E92\\u88C5\\u7F6E\", \"\\u5149\\u6C1B\\u56F4\", \"\\u5C0F\\u7EC4\\u9879\\u76EE\"]\n  },\n  title: {\n    en: \"Artificial Sky\",\n    cn: \"人造天空\"\n  },\n  subtitle: {\n    en: \"Artificial Sky stretches sunrise and sunset color shifts into a slow, low-light atmosphere.\",\n    cn: \"Artificial Sky 将日出与日落的色彩变化延展成缓慢的低光氛围。\"\n  },\n  role: {\n    en: \"Installation Designer\",\n    cn: \"\\u88C5\\u7F6E\\u8BBE\\u8BA1\\u5E08\"\n  },\n  tools: [\"LED Prototyping\", \"Spatial Design\", \"Material Testing\"],\n  scores: {\n    screenMatter: 90,\n    practicalExperimental: 75,\n    systemObject: 85\n  },\n  sections: [{\n    title: {\n      en: \"Artificial Atmosphere\",\n      cn: \"\\u4EBA\\u5DE5\\u6C1B\\u56F4\"\n    },\n    content: {\n      en: \"Artificial Sky was developed at the Royal College of Art in London with Dekai Wu, Haochen Zhang, Jiayue Guo, and Tong Su. In a low-light setting, the installation stretches shifting sunrise and sunset hues into a slow, perceivable gradient.\",\n      cn: \"Artificial Sky 是在伦敦皇家艺术学院与 Dekai Wu、Haochen Zhang、Jiayue Guo 和 Tong Su 合作完成的装置项目。低光环境中，日出与日落的色彩变化被拉长为缓慢且可感知的渐变。\"\n    },\n    image: \"assets/portfolio/artificial-sky/cover.jpg\",\n    imageAlt: {\n      en: \"Artificial Sky original cover image\",\n      cn: \"“人造天空”项目档案首图\"\n    },\n    caption: {\n      en: \"Project archive cover image.\",\n      cn: \"\\u9879\\u76EE\\u6863\\u6848\\u5BF9\\u5E94\\u9879\\u76EE\\u9996\\u56FE\\u3002\"\n    }\n  }, {\n    title: {\n      en: \"Colour as Time\",\n      cn: \"\\u4F5C\\u4E3A\\u65F6\\u95F4\\u7684\\u8272\\u5F69\"\n    },\n    content: {\n      en: \"Rather than recreating daylight, the installation asks whether a viewer can feel the ease of natural sky changes when that feeling is delivered by LEDs. Colour pairs were tested across times of day, material angles, and surface penetration, so the change would be subtle at first glance but plainly perceptible over time.\",\n      cn: \"\\u88C5\\u7F6E\\u5E76\\u4E0D\\u8BD5\\u56FE\\u590D\\u5236\\u767D\\u5929\\u7684\\u5929\\u7A7A\\uFF0C\\u800C\\u662F\\u8FFD\\u95EE\\uFF1A\\u5F53\\u8FD9\\u79CD\\u81EA\\u7136\\u53D8\\u5316\\u611F\\u7531 LED \\u4F20\\u9012\\u65F6\\uFF0C\\u89C2\\u4F17\\u662F\\u5426\\u4ECD\\u80FD\\u611F\\u5230\\u653E\\u677E\\uFF1F\\u56E2\\u961F\\u6D4B\\u8BD5\\u4E86\\u4E0D\\u540C\\u65F6\\u6BB5\\u7684\\u8272\\u5F69\\u7EC4\\u5408\\u3001\\u6750\\u6599\\u89D2\\u5EA6\\u548C\\u5149\\u7EBF\\u7A7F\\u900F\\u65B9\\u5F0F\\uFF0C\\u8BA9\\u53D8\\u5316\\u5728\\u7B2C\\u4E00\\u773C\\u5E76\\u4E0D\\u7A81\\u5140\\uFF0C\\u5374\\u80FD\\u968F\\u7740\\u65F6\\u95F4\\u88AB\\u6E05\\u695A\\u611F\\u77E5\\u3002\"\n    },\n    video: \"assets/portfolio/artificial-sky/demo.mp4\",\n    images: [{\n      src: \"assets/portfolio/artificial-sky/image-1.jpg\",\n      alt: {\n        en: \"Artificial Sky gradient study 1\",\n        cn: \"“人造天空”色彩渐变研究 1\"\n      }\n    }, {\n      src: \"assets/portfolio/artificial-sky/image-2.jpg\",\n      alt: {\n        en: \"Artificial Sky gradient study 2\",\n        cn: \"“人造天空”色彩渐变研究 2\"\n      }\n    }, {\n      src: \"assets/portfolio/artificial-sky/image-3.jpg\",\n      alt: {\n        en: \"Artificial Sky gradient study 3\",\n        cn: \"“人造天空”色彩渐变研究 3\"\n      }\n    }, {\n      src: \"assets/portfolio/artificial-sky/image-4.jpg\",\n      alt: {\n        en: \"Artificial Sky gradient study 4\",\n        cn: \"“人造天空”色彩渐变研究 4\"\n      }\n    }],\n    caption: {\n      en: \"Gradient studies used to simulate the slow colour shift of the sky over time.\",\n      cn: \"\\u7528\\u4E8E\\u6A21\\u62DF\\u5929\\u7A7A\\u989C\\u8272\\u968F\\u65F6\\u95F4\\u7F13\\u6162\\u53D8\\u5316\\u7684\\u6E10\\u53D8\\u7814\\u7A76\\u3002\"\n    }\n  }, {\n    title: {\n      en: \"Visible Construction\",\n      cn: \"\\u53EF\\u89C1\\u7684\\u4EBA\\u9020\\u7ED3\\u6784\"\n    },\n    content: {\n      en: \"The project deliberately exposes its man-made construction. Transparent acrylic back panels allow viewers to approach the work, follow behind it, and see the LED structure that maintains the calm atmosphere from within.\",\n      cn: \"\\u9879\\u76EE\\u6709\\u610F\\u66B4\\u9732\\u81EA\\u8EAB\\u7684\\u4EBA\\u9020\\u7ED3\\u6784\\u3002\\u900F\\u660E\\u4E9A\\u514B\\u529B\\u80CC\\u677F\\u8BA9\\u89C2\\u4F17\\u53EF\\u4EE5\\u9760\\u8FD1\\u3001\\u7ED5\\u5230\\u80CC\\u9762\\uFF0C\\u5E76\\u770B\\u5230\\u7EF4\\u6301\\u8FD9\\u7247\\u5E73\\u9759\\u6C1B\\u56F4\\u7684 LED \\u7ED3\\u6784\\u672C\\u8EAB\\u3002\"\n    },\n    images: [{\n      src: \"assets/portfolio/artificial-sky/visible-1.jpg\",\n      alt: {\n        en: \"Visible LED structure behind translucent panel\",\n        cn: \"\\u534A\\u900F\\u660E\\u9762\\u677F\\u80CC\\u540E\\u53EF\\u89C1\\u7684 LED \\u7ED3\\u6784\"\n      },\n      caption: {\n        en: \"Exposed construction revealing the light source behind the atmosphere.\",\n        cn: \"\\u66B4\\u9732\\u7684\\u6784\\u9020\\u63ED\\u793A\\u4E86\\u6C1B\\u56F4\\u80CC\\u540E\\u7684\\u5149\\u6E90\\u3002\"\n      }\n    }, {\n      src: \"assets/portfolio/artificial-sky/visible-2.jpg\",\n      alt: {\n        en: \"Close-up of LED wiring and acrylic structure\",\n        cn: \"LED \\u63A5\\u7EBF\\u4E0E\\u4E9A\\u514B\\u529B\\u7ED3\\u6784\\u7279\\u5199\"\n      },\n      caption: {\n        en: \"Material detail showing the transition between structure and atmosphere.\",\n        cn: \"\\u7ED3\\u6784\\u4E0E\\u6C1B\\u56F4\\u4E4B\\u95F4\\u7684\\u6750\\u6599\\u8FC7\\u6E21\\u7EC6\\u8282\\u3002\"\n      }\n    }]\n  }, {\n    title: {\n      en: \"Process Journal\",\n      cn: \"\\u8FC7\\u7A0B\\u8BB0\\u5F55\"\n    },\n    content: {\n      en: \"A complete record of the project development process, from initial concept exploration through material testing, structural prototyping, and exhibition preparation.\",\n      cn: \"\\u4ECE\\u6982\\u5FF5\\u63A2\\u7D22\\u5230\\u6750\\u6599\\u6D4B\\u8BD5\\u3001\\u7ED3\\u6784\\u539F\\u578B\\u642D\\u5EFA\\u518D\\u5230\\u5C55\\u89C8\\u51C6\\u5907\\u7684\\u5168\\u8FC7\\u7A0B\\u8BB0\\u5F55\\u3002\"\n    },\n    layout: \"pdf-viewer\",\n    pdfPages: [{\n      src: \"assets/portfolio/artificial-sky/process-journal/page-01.jpg\",\n      alt: {\n        en: \"Process Journal page 1\",\n        cn: \"\\u8FC7\\u7A0B\\u8BB0\\u5F55\\u7B2C 1 \\u9875\"\n      }\n    }, {\n      src: \"assets/portfolio/artificial-sky/process-journal/page-02.jpg\",\n      alt: {\n        en: \"Process Journal page 2\",\n        cn: \"\\u8 src: \"assets/portfolio/artificial-sky/process-journal/page-12.jpg\",\n      alt: {\n        en: \"Process Journal page 12\",\n        cn: \"\\u8FC7\\u7A0B\\u8BB0\\u5F55\\u7B2C 12 \\u9875\"\n      }\n    }, {\n      src: \"assets/portfolio/artificial-sky/process-journal/page-13.jpg\",\n      alt: {\n        en: \"Process Journal page 13\",\n        cn: \"\\u8FC7\\u7A0B\\u8BB0\\u5F55\\u7B2C 13 \\u9875\"\n      }\n    }, {\n      src: \"assets/portfolio/artificial-sky/process-journal/page-14.jpg\",\n      alt: {\n        en: \"Process Journal page 14\",\n        cn: \"\\u8FC7\\u7A0B\\u8BB0\\u5F55\\u7B2C 14 \\u9875\"\n      }\n    }, {\n      src: \"assets/portfolio/artificial-sky/process-journal/page-15.jpg\",\n      alt: {\n        en: \"Process Journal page 15\",\n        cn: \"\\u8FC7\\u7A0B\\u8BB0\\u5F55\\u7B2C 15 \\u9875\"\n      }\n    }, {\n      src: \"assets/portfolio/artificial-sky/process-journal/page-16.jpg\",\n      alt: {\n        en: \"Process Journal page 16\",\n        cn: \"\\u8FC7\\u7A0B\\u8BB0\\u5F55\\u7B2C 16 \\u9875\"\n      }\n    }, {\n      src: \"assets/portfolio/artificial-sky/process-journal/page-17.jpg\",\n      alt: {\n        en: \"Process Journal page 17\",\n        cn: \"\\u8FC7\\u7A0B\\u8BB0\\u5F55\\u7B2C 17 \\u9875\"\n      }\n    }, {\n      src: \"assets/portfolio/artificial-sky/process-journal/page-18.jpg\",\n      alt: {\n        en: \"Process Journal page 18\",\n        cn: \"\\u8FC7\\u7A0B\\u8BB0\\u5F55\\u7B2C 18 \\u9875\"\n      }\n    }, {\n      src: \"assets/portfolio/artificial-sky/process-journal/page-19.jpg\",\n      alt: {\n        en: \"Process Journal page 19\",\n        cn: \"\\u8FC7\\u7A0B\\u8BB0\\u5F55\\u7B2C 19 \\u9875\"\n      }\n    }],\n    totalPages: 19\n  }]\n}, {\n  id: \"p7\",\n  slug: \"sonic-patrol\",\n  category: \"interaction-mechanisms\",\n  year: \"2021\",\n  featured: false,\n  coverImage: \"assets/portfolio/sonic-patrol/cover.jpg\",\n  tags: {\n    en: [\"Game Mechanism\", \"Ocean Noise\", \"Systems Approach\"],\n    cn: [\"\\u6E38\\u620F\\u673A\\u5236\", \"\\u6D77\\u6D0B\\u566A\\u58F0\", \"\\u7CFB\\u7EDF\\u65B9\\u6CD5\"]\n  },\n  title: {\n    en: \"Sonic Patrol\",\n    cn: \"声波巡逻\"\n  },\n  subtitle: {\n    en: \"Sonic Patrol turns anthropogenic ocean noise into a playable system where players detect pollution, coordinate action, and surface accountability gaps.\",\n    cn: \"Sonic Patrol 将人类活动造成的海洋噪声转化为可游玩的侦测与协作系统，让玩家在任务中识别污染、参与行动，并看见责任缺口。\"\n  },\n  role: {\n    en: \"Interaction Designer, systems storyteller, and project collaborator\",\n    cn: \"\\u4EA4\\u4E92\\u8BBE\\u8BA1\\u3001\\u7CFB\\u7EDF\\u53D9\\u4E8B\\u4E0E\\u5C0F\\u7EC4\\u534F\\u4F5C\"\n  },\n  tools: [\"Game Narrative\", \"Environmental Research\", \"Interaction System\", \"Stakeholder Mapping\"],\n  scores: {\n    screenMatter: 20,\n    practicalExperimental: 85,\n    systemObject: 65\n  },\n  sections: [{\n    title: {\n      en: \"Problem: Ocean Noise\",\n      cn: \"海洋噪声问题\"\n    },\n    content: {\n      en: \"Sonic Patrol was developed for RCA Grand Challenge 2021/22: New Economic Model for the Oceans, with Gangchi Li, Claire Henery, Tomoyo Tsurumi, and Sandra Poulson. The project starts by framing ocean noise as a real but hard-to-see environmental problem: climate events generate sound, but the dominant and growing pressure comes from anthropogenic sources such as shipping, sonar, seismic survey, drilling, and offshore construction.\",\n      cn: \"“声波巡逻”来自 RCA Grand Challenge 2021/22「New Economic Model for the Oceans」，合作成员包括 Gangchi Li、Claire Henery、Tomoyo Tsurumi 和 Sandra Poulson。项目从“海洋噪声是真实存在却难以直观感知的环境问题”这一识别出发：气候事件也会产生声音，但主导且持续增长的压力来自船运、声纳、地震勘测、钻井和海上施工等人为噪声。\"\n    },\n    video: \"assets/portfolio/sonic-patrol/grand-challenge.mp4\",\n    image: \"assets/portfolio/sonic-patrol/pdf-pages/page-1.png\",\n    imageAlt: {\n      en: \"Problem board showing ocean noise sources, vessel growth, whale impact, and existing solutions\",\n      cn: \"\\u5C55\\u793A\\u6D77\\u6D0B\\u566A\\u58F0\\u6765\\u6E90\\u3001\\u8239\\u53EA\\u589E\\u957F\\u3001\\u9CB8\\u7C7B\\u53D7\\u5F71\\u54CD\\u548C\\u73B0\\u6709\\u65B9\\u6848\\u7684\\u95EE\\u9898\\u677F\"\n    },\n    caption: {\n      en: \"The Grand Challenge video introduces the team and the project context.\",\n      cn: \"Grand Challenge \\u89C6\\u9891\\u7528\\u4E8E\\u4ECB\\u7ECD\\u56E2\\u961F\\u4E0E\\u9879\\u76EE\\u8BED\\u5883\\u3002\"\n    },\n    annotations: {\n      en: [\n        \"Shipping is positioned as the largest anthropogenic contributor in the project framing.\",\n        \"The board links vessel growth with rising underwater noise and whale communication disruption.\",\n        \"Existing solutions such as speed limits, engine upgrades, and protected zones are presented as partial and insufficient.\"\n      ],\n      cn: [\n        \"\\u5728\\u9879\\u76EE\\u7684\\u95EE\\u9898\\u5B9A\\u4E49\\u4E2D\\uff0c\\u8239\\u8FD0\\u88AB\\u653E\\u5728\\u6700\\u4E3B\\u8981\\u7684\\u4EBA\\u4E3A\\u566A\\u58F0\\u6765\\u6E90\\u4F4D\\u7F6E\\u3002\",\n        \"\\u8FD9\\u4E00\\u9875\\u628A\\u8239\\u53EA\\u6570\\u91CF\\u589E\\u957F\\u3001\\u6C34\\u4E0B\\u566A\\u58F0\\u4E0A\\u5347\\u4E0E\\u9CB8\\u7C7B\\u4EA4\\u6D41\\u53D7\\u6270\\u76F8\\u4E92\\u8FDE\\u63A5\\u8D77\\u6765\\u3002\",\n        \"\\u9650\\u901F\\u3001\\u5F15\\u64CE\\u5347\\u7EA7\\u548C\\u4FDD\\u62A4\\u533A\\u7B49\\u73B0\\u6709\\u65B9\\u6848\\u88AB\\u5448\\u73B0\\u4E3A\\u5FC5\\u8981\\u4F46\\u4ECD\\u4E0D\\u5145\\u5206\\u7684\\u90E8\\u5206\\u5E94\\u5BF9\\u3002\"\n      ]\n    }\n  }, {\n    title: {\n      en: \"Systems Approach\",\n      cn: \"治理系统与责任缺口\"\n    },\n    content: {\n    en: \"The second stage widens the problem into governance and territorial systems. It maps the relationship between the IMO, United Nations, local regulation, and ocean-care organizations, then places ocean noise within legal zoning from territorial waters to the high seas. This shifts the project from a single environmental symptom to a distributed system with responsibility gaps.\",\n      cn: \"项目把问题从环境现象扩展到治理与领域系统。它梳理了 IMO、联合国、地方监管与海洋保护组织之间的关系，并把海洋噪声置于从领海到公海的法律分区之中。这让项目从单一的污染症状转向存在责任断层的分布式系统。\"\n    },\n    image: \"assets/portfolio/sonic-patrol/pdf-pages/page-2.png\",\n    imageAlt: {\n      en: \"Stakeholder map and legal zoning diagram for ocean governance\",\n      cn: \"\\u6D77\\u6D0B\\u6CBB\\u7406\\u7684\\u5229\\u76CA\\u76F8\\u5173\\u8005\\u5730\\u56FE\\u4E0E\\u6CD5\\u5F8B\\u5206\\u533A\\u56FE\"\n    },\n    caption: {\n      en: \"The stakeholder map and zoning section explain why ocean noise cannot be addressed only through isolated technical fixes.\",\n      cn: \"\\u5229\\u76CA\\u76F8\\u5173\\u8005\\u4E0E\\u6D77\\u57DF\\u5206\\u533A\\u90E8\\u5206\\u8BF4\\u660E\\uff0c\\u6D77\\u6D0B\\u566A\\u58F0\\u4E0D\\u80FD\\u53EA\\u901A\\u8FC7\\u5B64\\u7ACB\\u7684\\u6280\\u672F\\u8865\\u4E01\\u6765\\u89E3\\u51B3\\u3002\"\n    },\n    annotations: {\n      en: [\n        \"The project aligns itself with SDG 14 and ocean-conservation policy discourse.\",\n        \"Territorial sea, EEZ, and high seas are treated as design constraints as well as legal conditions.\",\n        \"A central question mark in the stakeholder map signals a governance gap rather than a lack of data alone.\"\n      ],\n      cn: [\n        \"\\u9879\\u76EE\\u4E3B\\u52A8\\u4E0E SDG 14 \\u53CA\\u6D77\\u6D0B\\u4FDD\\u62A4\\u653F\\u7B56\\u8BAE\\u9898\\u5BF9\\u9F50\\u3002\",\n        \"\\u9886\\u6D77\\u3001EEZ \\u4E0E\\u516C\\u6D77\\u5728\\u8FD9\\u91CC\\u65E2\\u662F\\u6CD5\\u5F8B\\u6761\\u4EF6\\uff0c\\u4E5F\\u662F\\u8BBE\\u8BA1\\u7EA6\\u675F\\u3002\",\n        \"\\u5229\\u76CA\\u76F8\\u5173\\u8005\\u56FE\\u4E2D\\u95F4\\u7684\\u95EE\\u53F7\\u66F4\\u50CF\\u662F\\u5BF9\\u6CBB\\u7406\\u7F3A\\u53E3\\u7684\\u6307\\u8BA4\\uff0c\\u800C\\u4E0D\\u53EA\\u662F\\u5BF9\\u6570\\u636E\\u7F3A\\u5931\\u7684\\u63CF\\u8FF0\\u3002\"\n      ]\n    },\n    fullWidthMedia: true\n  }, {\n    title: {\n      en: \"Why Gaming\",\n      cn: \"为什么选择游戏\"\n    },\n    content: {\n      en: \"Gaming is a fitting medium because it already reaches large publics, offers familiar participation frameworks, and can translate real-world agendas into compelling play. References like Monopoly and Petroleo show how board and strategy games can encode economic or political systems. Sonic Patrol adopts that logic to bring ocean pollution into an action context that traditional game players can enter.\",\n      cn: \"游戏媒介本身已经触达大规模公众，拥有熟悉的参与框架，也能把现实议题转译为有吸引力的玩法。Monopoly 和 Petroleo 等参考说明，桌游与策略游戏可以编码经济或政治系统。“声波巡逻”沿用这一逻辑，将海洋污染议题带入传统游戏玩家能够参与的行动场景。\"\n    },\n    image: \"assets/portfolio/sonic-patrol/pdf-pages/page-3.png\",\n    imageAlt: {\n      en: \"Page explaining game references, gaming statistics, and reverse engineering from real world to agenda to game\",\n      cn: \"游戏参考、玩家统计与从现实议题到游戏机制的转译\"\n    },\n    caption: {\n      en: \"Audience scale, historical game references, and a playable framing strategy come together as a communication model for environmental issues.\",\n      cn: \"受众规模、历史游戏参考与面向环境传播的可玩性框架在这里共同形成传播模型。\"\n    },\n    annotations: {\n      en: [\n        \"The project treats games as an existing cultural network rather than as a neutral communication channel.\",\n        \"Its target audience is mainstream gamers, not people already motivated by environmental activism.\",\n        \"The key move is to convert agenda into mechanics without making the experience feel like instruction.\"\n      ],\n      cn: [\n        \"\\u9879\\u76EE\\u628A\\u6E38\\u620F\\u89C6\\u4E3A\\u4E00\\u4E2A\\u5DF2\\u7ECF\\u5B58\\u5728\\u7684\\u6587\\u5316\\u7F51\\u7EDC\\uff0c\\u800C\\u4E0D\\u53EA\\u662F\\u4E00\\u4E2A\\u4E2D\\u6027\\u7684\\u4F20\\u64AD\\u6E20\\u9053\\u3002\",\n        \"\\u5B83\\u7684\\u76EE\\u6807\\u53D7\\u4F17\\u662F\\u4E3B\\u6D41\\u73A9\\u5BB6\\uff0c\\u800C\\u4E0D\\u662F\\u5DF2\\u7ECF\\u5177\\u6709\\u73AF\\u4FDD\\u52A8\\u673A\\u7684\\u4EBA\\u7FA4\\u3002\",\n        \"\\u6700\\u5173\\u952E\\u7684\\u8F6C\\u8BD1\\u52A8\\u4F5C\\uff0c\\u662F\\u5728\\u4E0D\\u8BA9\\u4F53\\u9A8C\\u53D8\\u6210\\u8BF4\\u6559\\u7684\\u524D\\u63D0\\u4E0B\\uff0c\\u628A\\u8BAE\\u9898\\u5199\\u8FDB\\u673A\\u5236\\u91CC\\u3002\"\n      ]\n    },\n    fullWidthMedia: true\n  }, {\n    title: {\n      en: \"Sonic Patrol: The Game\",\n      cn: \"Sonic Patrol 游戏机制\"\n    },\n    content: {\n      en: \"The game proposal defines a suspense-driven mission structure where players identify pollution and work toward its eradication. The design borrows teamwork, mission flow, interface tools, and character progression from familiar game genres, then connects them to a loop of data collection, participation, and accountability. Sound becomes the project's distinctive interface element and narrative trigger.\",\n      cn: \"游戏提案定义了世界观与机制设计。玩家在悬疑任务推动的流程中识别污染，并尝试推动其消除。设计借用了团队协作、任务线、界面工具和角色成长等熟悉的游戏类型语法，再把它们连接到数据采集、公众参与与环境问责的循环中。“声音”则成为这个项目最标志性的界面元素与叙事触发器。\"\n    },\n    image: \"assets/portfolio/sonic-patrol/pdf-pages/page-4.png\",\n    imageAlt: {\n      en: \"Sonic Patrol world view, gaming strategies, impact loop, and sound-based interface proposition\",\n      cn: \"展示“声波巡逻”世界观、游戏策略、影响闭环和声音独特卖点\"\n    },\n    caption: {\n      en: \"The core proposal combines game references with an environmental action loop built around data, platform participation, and policy accountability.\",\n      cn: \"\\u6838\\u5FC3\\u63D0\\u6848\\u628A\\u6E38\\u620F\\u53C2\\u8003\\u4E0E\\u4E00\\u4E2A\\u56F4\\u7ED5\\u6570\\u636E\\u3001\\u5E73\\u53F0\\u53C2\\u4E0E\\u548C\\u653F\\u7B56\\u95EE\\u8D23\\u5EFA\\u6784\\u7684\\u73AF\\u5883\\u884C\\u52A8\\u95ED\\u73AF\\u7ED3\\u5408\\u5728\\u4E00\\u8D77\\u3002\"\n    },\n    annotations: {\n      en: [\n        \"The mission is framed as urgent but still legible through familiar game logic.\",\n        \"The proposal triangulates data, public participation, and organizational accountability instead of stopping at awareness.\",\n        \"Sound is presented as the project's USP because it makes invisible pollution playable and perceptible.\"\n      ],\n      cn: [\n        \"任务保持紧迫感，同时沿用熟悉的游戏逻辑，降低理解门槛。\",\n        \"\\u63D0\\u6848\\u5E76\\u4E0D\\u505C\\u5728\\u201C\\u63D0\\u5347\\u610F\\u8BC6\\u201D\\uff0c\\u800C\\u662F\\u5C1D\\u8BD5\\u628A\\u6570\\u636E\\u3001\\u516C\\u4F17\\u53C2\\u4E0E\\u548C\\u7EC4\\u7EC7\\u95EE\\u8D23\\u4E09\\u8005\\u4E32\\u8054\\u8D77\\u6765\\u3002\",\n        \"\\u58F0\\u97F3\\u88AB\\u5B9A\\u4F4D\\u4E3A\\u9879\\u76EE\\u7684 USP\\uff0c\\u56E0\\u4E3A\\u5B83\\u80FD\\u8BA9\\u4E0D\\u53EF\\u89C1\\u7684\\u6C61\\u67D3\\u53D8\\u5F97\\u53EF\\u73A9\\u3001\\u53EF\\u611F\\u77E5\\u3002\"\n      ]\n    },\n    fullWidthMedia: true\n  }, {\n    title: {\n      en: \"Future Roadmap\",\n      cn: \"未来实施路线\"\n    },\n    content: {\n      en: \"The final stage projects the concept forward. It proposes a first-stage prototype using NEMO technology in St Helena, followed by a second-stage full implementation with live data and vessel coverage at worldwide scale. The roadmap imagines that gameplay can contribute to political will, incentives, law revision, and technological implementation over time, eventually bending the trajectory of ocean-noise pollution.\",\n      cn: \"未来路线将概念推向实施。路线图提出了两个阶段：先用 St Helena 的 NEMO 技术进行原型实施，然后进入结合实时数据与全球船舶网络的全面实施。项目设想游戏机制能在时间中逐步影响政治意志、激励提案、法律修订和技术落地，并最终改变海洋噪声污染的走势。\"\n    },\n    image: \"assets/portfolio/sonic-patrol/pdf-pages/page-5.png\",\n    imageAlt: {\n      en: \"Future roadmap showing staged implementation and projected impact\",\n      cn: \"\\u5C55\\u793A\\u5206\\u9636\\u6BB5\\u5B9E\\u65BD\\u4E0E\\u9884\\u671F\\u5F71\\u54CD\\u7684\\u672A\\u6765\\u8DEF\\u7EBF\\u56FE\"\n    },\n    caption: {\n      en: \"The roadmap moves the project from game concept into a staged intervention model.\",\n      cn: \"路线图把项目从游戏概念推进到分阶段的环境干预模型。\"\n    },\n    annotations: {\n      en: [\n        \"Stage one focuses on prototyping with a specific sensing technology and site.\",\n        \"Stage two imagines live data and global vessel integration as the condition for full implementation.\",\n        \"The impact model ties technical deployment to law revision, incentives, and government commitment.\"\n      ],\n      cn: [\n        \"\\u7B2C\\u4E00\\u9636\\u6BB5\\u805A\\u7126\\u4E8E\\u57FA\\u4E8E\\u7279\\u5B9A\\u611F\\u77E5\\u6280\\u672F\\u4E0E\\u573A\\u5730\\u7684\\u539F\\u578B\\u9A8C\\u8BC1\\u3002\",\n        \"\\u7B2C\\u4E8C\\u9636\\u6BB5\\u5219\\u628A\\u5B9E\\u65F6\\u6570\\u636E\\u548C\\u5168\\u7403\\u8239\\u8236\\u7F51\\u7EDC\\u63A5\\u5165\\u89C6\\u4E3A\\u5168\\u9762\\u5B9E\\u65BD\\u7684\\u6761\\u4EF6\\u3002\",\n        \"\\u8FD9\\u4E2A\\u5F71\\u54CD\\u6A21\\u578B\\u628A\\u6280\\u672F\\u90E8\\u7F72\\u4E0E\\u6CD5\\u5F8B\\u4FEE\\u8BA2\\u3001\\u6FC0\\u52B1\\u673A\\u5236\\u3001\\u653F\\u5E9C\\u627F\\u8BFA\\u7ED1\\u5728\\u4E86\\u4E00\\u8D77\\u3002\"\n      ]\n    },\n    fullWidthMedia: true\n  }]\n}, {\n  id: \"p8\",\n  slug: \"backer\",\n  category: \"service-brand\",\n  year: \"2022\",\n  featured: false,\n  coverImage: \"assets/portfolio/backer/kaoshan.jpg\",\n  tags: {\n    en: [\"Cultural IP\", \"Visual System\", \"Product Modelling\"],\n    cn: [\"文旅 IP\", \"视觉体系\", \"产品建模\"]\n  },\n  title: {\n    en: \"Patron\",\n    cn: \"靠山\"\n  },\n  subtitle: {\n    en: \"A Chenzhou cultural tourism IP and product visualisation project built around the idea of support and protection.\",\n    cn: \"围绕支持与守护意象展开的郴州文旅 IP 与产品视觉化项目。\"\n  },\n  role: {\n    en: \"Product Modeller, Visual Designer\",\n    cn: \"产品建模与视觉设计师\"\n  },\n  tools: [\"Product Modelling\", \"Illustration\", \"Poster Design\"],\n  scores: {\n    screenMatter: 40,\n    practicalExperimental: 30,\n    systemObject: 80\n  },\n  sections: [{\n    title: {\n      en: \"Project Introduction\",\n      cn: \"项目介绍\"\n    },\n    content: {\n      en: \"Patron develops a Chenzhou cultural tourism IP through product visualisation and souvenir design. Built around the image of support and protection, the work translates regional character into an approachable visual system.\",\n      cn: \"《靠山》围绕郴州地域文化发展文旅 IP、产品视觉与文创方向。项目以“靠山”承载的支持、守护与依靠感为核心，将地方文化意象转译为亲近、可传播的视觉系统。\"\n    },\n    layout: \"pdf-viewer\",\n    pdfPages: [{\n      src: \"assets/portfolio/backer/process-pdf/page-01.jpg\",\n      alt: {\n        en: \"Patron process archive 01\",\n        cn: \"《靠山》过程档案 01\"\n      }\n    }, {\n      src: \"assets/portfolio/backer/process-pdf/page-02.jpg\",\n      alt: {\n        en: \"Patron process archive 02\",\n        cn: \"《靠山》过程档案 02\"\n      }\n    }, {\n      src: \"assets/portfolio/backer/process-pdf/page-03.jpg\",\n      alt: {\n        en: \"Patron process archive 03\",\n        cn: \"《靠山》过程档案 03\"\n      }\n    }, {\n      src: \"assets/portfolio/backer/process-pdf/page-04.jpg\",\n      alt: {\n        en: \"Patron process archive 04\",\n        cn: \"《靠山》过程档案 04\"\n      }\n    }, {\n      src: \"assets/portfolio/backer/process-pdf/page-05.jpg\",\n      alt: {\n        en: \"Patron process archive 05\",\n        cn: \"《靠山》过程档案 05\"\n      }\n    }, {\n      src: \"assets/portfolio/backer/process-pdf/page-06.jpg\",\n      alt: {\n        en: \"Patron process archive 06\",\n        cn: \"《靠山》过程档案 06\"\n      }\n    }, {\n      src: \"assets/portfolio/backer/process-pdf/page-07.jpg\",\n      alt: {\n        en: \"Patron process archive 07\",\n        cn: \"《靠山》过程档案 07\"\n      }\n    }, {\n      src: \"assets/portfolio/backer/process-pdf/page-08.jpg\",\n      alt: {\n        en: \"Patron process archive 08\",\n        cn: \"《靠山》过程档案 08\"\n      }\n    }, {\n      src: \"assets/portfolio/backer/process-pdf/page-09.jpg\",\n      alt: {\n        en: \"Patron process archive 09\",\n        cn: \"《靠山》过程档案 09\"\n      }\n    }, {\n      src: \"assets/portfolio/backer/process-pdf/page-10.jpg\",\n      alt: {\n        en: \"Patron process archive 10\",\n        cn: \"《靠山》过程档案 10\"\n      }\n    }, {\n      src: \"assets/portfolio/backer/process-pdf/page-11.jpg\",\n      alt: {\n        en: \"Patron process archive 11\",\n        cn: \"《靠山》过程档案 11\"\n      }\n    } 90\n  },\n  sections: [{\n    title: {\n      en: \"Interactive WeChat Article\",\n      cn: \"\\u4EA4\\u4E92\\u5F0F\\u516C\\u4F17\\u53F7\\u63A8\\u6587\"\n    },\n    content: {\n      en: \"The interaction follows a tap sequence: play music, expand the story, rotate the screen, and continue through a connected horizontal narrative.\",\n      cn: \"\\u63A8\\u6587\\u4F53\\u9A8C\\u88AB\\u7EC4\\u7EC7\\u6210\\u4E00\\u6761\\u8FDE\\u7EED\\u7684\\u70B9\\u51FB\\u8DEF\\u5F84\\uFF1A\\u64AD\\u653E\\u97F3\\u4E50\\u3001\\u5C55\\u5F00\\u5185\\u5BB9\\u3001\\u65CB\\u8F6C\\u5C4F\\u5E55\\uFF0C\\u518D\\u8FDB\\u5165\\u6A2A\\u5411\\u8FDE\\u7EED\\u9605\\u8BFB\\u3002\"\n    },\n    image: \"assets/portfolio/riverside-changsha/cover.jpg\",\n    imageAlt: {\n      en: \"Riverside Changsha cover image\",\n      cn: \"江畔长沙封面图\"\n    },\n    caption: {\n      en: \"Project cover image from the existing portfolio archive.\",\n      cn: \"\\u6765\\u81EA\\u73B0\\u6709\\u4F5C\\u54C1\\u96C6\\u6863\\u6848\\u7684\\u9879\\u76EE\\u5C01\\u9762\\u3002\"\n    }\n  }, {\n    title: {\n      en: \"Horizontal Narrative Flow\",\n      cn: \"\\u6A2A\\u5411\\u53D9\\u4E8B\\u6D41\\u7A0B\"\n    },\n    content: {\n      en: \"The visual sequence remains the core artifact, showing how music, gestures, and orientation changes shape the original mobile story.\",\n      cn: \"\\u9875\\u9762\\u4FDD\\u7559\\u539F\\u516C\\u4F17\\u53F7\\u89C6\\u89C9\\u5185\\u5BB9\\u4F5C\\u4E3A\\u4E3B\\u4F53\\uFF0C\\u7528\\u7F51\\u9875\\u590D\\u73B0\\u5B83\\u5728\\u624B\\u673A\\u7AEF\\u9010\\u6B65\\u5C55\\u5F00\\u7684\\u9605\\u8BFB\\u65B9\\u5F0F\\u3002\"\n    },\n    image: \"assets/portfolio/riverside-changsha/board.png\",\n    imageAlt: {\n      en: \"Riverside Changsha long editorial board\",\n      cn: \"江畔长沙 长图内容版式\"\n    },\n    caption: {\n      en: \"Archived board view of the horizontal story.\",\n      cn: \"\\u9879\\u76EE\\u6863\\u6848\\u4E2D\\u7684\\u6A2A\\u5411\\u53D9\\u4E8B\\u603B\\u89C8\\u3002\"\n    }\n  }]\n}, {\n  id: \"p10\",\n  slug: \"decathlon-website\",\n  category: \"service-brand\",\n  year: \"2021\",\n  featured: false,\n  coverImage: \"assets/portfolio/decathlon-website/cover.jpg\",\n  tags: {\n    en: [\"E-commerce\", \"Product Page\", \"Retail Storytelling\"],\n    cn: [\"\\u7535\\u5546\\u8BBE\\u8BA1\", \"\\u5546\\u54C1\\u9875\", \"\\u96F6\\u552E\\u53D9\\u4E8B\"]\n  },\n  title: {\n    en: \"Decathlon Website\",\n    cn: \"\\u8FEA\\u5361\\u4FAC\\u5546\\u54C1\\u9875\"\n  },\n  subtitle: {\n    en: \"Tmall product-page creation and maintenance for Decathlon China.\",\n    cn: \"\\u4E3A\\u8FEA\\u5361\\u4FAC\\u4E2D\\u56FD\\u521B\\u5EFA\\u5E76\\u7EF4\\u62A4\\u5929\\u732B\\u5546\\u54C1\\u9875\\u9762\\u3002\"\n  },\n  role: {\n    en: \"E-commerce Designer\",\n    cn: \"\\u7535\\u5546\\u8BBE\\u8BA1\\u5E08\"\n  },\n  tools: [\"Tmall Page Design\", \"Product Storytelling\", \"Visual Layout\"],\n  scores: {\n    screenMatter: 15,\n    practicalExperimental: 10,\n    systemObject: 90\n  },\n  sections: [{\n    title: {\n      en: \"Qiutai Crucian Carp Rod\",\n      cn: \"\\u79CB\\u82D4\\u9CAB\\u9C7C\\u7AFF\"\n    },\n    content: {\n      en: \"A long-form product page for a lightweight crucian-carp rod. The visual sequence begins with its 2/8 fast action and moves through low weight, load testing, grip details, material structure, size options, and fishing scenarios.\",\n      cn: \"\\u9762\\u5411\\u8F7B\\u91CF\\u9CAB\\u9C7C\\u7AFF\\u7684\\u957F\\u9875\\u5546\\u54C1\\u8BBE\\u8BA1\\u3002\\u9875\\u9762\\u4ECE 2/8 \\u8C03\\u5FEB\\u901F\\u56DE\\u9C7C\\u5207\\u5165\\uFF0C\\u4F9D\\u6B21\\u5448\\u73B0\\u8F7B\\u76C8\\u7AFF\\u8EAB\\u3001\\u8D1F\\u8F7D\\u6D4B\\u8BD5\\u3001\\u63E1\\u6301\\u7EC6\\u8282\\u3001\\u6750\\u8D28\\u7ED3\\u6784\\u3001\\u5C3A\\u5BF8\\u9009\\u62E9\\u4E0E\\u5B9E\\u9645\\u5782\\u9493\\u573A\\u666F\\u3002\"\n    },\n    image: \"assets/portfolio/decathlon-website/products/qiutai-crucian-rod.jpg\",\n    previewImage: \"assets/portfolio/decathlon-website/previews/qiutai-crucian-rod-preview.jpg\",\n    imageAlt: {\n      en: \"Complete Qiutai crucian-carp rod product page\",\n      cn: \"\\u79CB\\u82D4\\u9CAB\\u9C7C\\u7AFF\\u5B8C\\u6574\\u5546\\u54C1\\u8BE6\\u60C5\\u957F\\u9875\"\n    },\n    caption: {\n      en: \"Scroll inside the canvas to read the complete product page.\",\n      cn: \"\\u5728\\u53F3\\u4FA7\\u753B\\u5E03\\u5185\\u6EDA\\u52A8\\uFF0C\\u67E5\\u770B\\u5B8C\\u6574\\u5546\\u54C1\\u8BE6\\u60C5\\u9875\\u3002\"\n    },\n    annotations: {\n      en: [\n        \"2/8 fast action for responsive line control.\",\n        \"A lightweight SVF carbon-fibre body starting from 95 g.\",\n        \"Durability is supported by a 1.2 kg net-load test.\"\n      ],\n      cn: [\n        \"2/8 \\u8C03\\u6027\\uFF0C\\u5F3A\\u8C03\\u5FEB\\u901F\\u56DE\\u9C7C\\u4E0E\\u64CD\\u63A7\\u54CD\\u5E94\\u3002\",\n        \"SVF \\u78B3\\u7EA4\\u7EF4\\u8F7B\\u91CF\\u7AFF\\u8EAB\\uFF0C\\u9C7C\\u7AFF\\u51C0\\u91CD 95g \\u8D77\\u3002\",\n        \"\\u901A\\u8FC7 1.2kg \\u51C0\\u9493\\u91CD\\u8D1F\\u8F7D\\u6D4B\\u8BD5\\u5448\\u73B0\\u8010\\u7528\\u6027\\u3002\"\n      ]\n    }\n  }, {\n    title: {\n      en: \"Pokong Spinning Lure Set\",\n      cn: \"\\u7834\\u7A7A\\u7EBA\\u8F66\\u8F6E\\u8DEF\\u4E9A\\u5957\\u88C5\"\n    },\n    content: {\n      en: \"A retail page for a beginner-friendly spinning lure set. The layout connects the rod, spinning reel, line, lure accessories, and portable storage as one complete system, then explains strength, durability, weight, and practical setup details.\",\n      cn: \"\\u9762\\u5411\\u6613\\u4E0A\\u624B\\u8DEF\\u4E9A\\u4F53\\u9A8C\\u7684\\u7EBA\\u8F66\\u8F6E\\u5957\\u88C5\\u5546\\u54C1\\u9875\\u3002\\u7248\\u5F0F\\u5C06\\u9493\\u7AFF\\u3001\\u7EBA\\u8F66\\u8F6E\\u3001\\u9C7C\\u7EBF\\u3001\\u62DF\\u9975\\u914D\\u4EF6\\u4E0E\\u4FBF\\u643A\\u6536\\u7EB3\\u7EC4\\u5408\\u4E3A\\u5B8C\\u6574\\u7CFB\\u7EDF\\uFF0C\\u5E76\\u8FDB\\u4E00\\u6B65\\u8BF4\\u660E\\u5F3A\\u5EA6\\u3001\\u8010\\u7528\\u6027\\u3001\\u8F7B\\u91CF\\u5316\\u4 }\n      }, {\n        page: 4,\n        title: { en: \"Study Roadmap\", cn: \"\\u5B9E\\u9A8C\\u601D\\u8DEF\" },\n        content: {\n          en: \"The research progresses through three connected stages: experiment design, experiment execution, and data analysis. Each stage defines its own research inputs, procedures, and outputs.\",\n          cn: \"\\u7814\\u7A76\\u5206\\u4E3A\\u5B9E\\u9A8C\\u8BBE\\u8BA1\\u3001\\u5B9E\\u9A8C\\u5C55\\u5F00\\u4E0E\\u6570\\u636E\\u5206\\u6790\\u4E09\\u4E2A\\u8FDE\\u7EED\\u9636\\u6BB5\\uFF0C\\u5206\\u522B\\u5BF9\\u5E94\\u6848\\u5934\\u5206\\u6790\\u4E0E\\u65B9\\u6848\\u642D\\u5EFA\\u3001\\u6B63\\u5F0F\\u6D4B\\u8BD5\\u4E0E\\u8BB0\\u5F55\\uFF0C\\u4EE5\\u53CA\\u95EE\\u5377\\u3001\\u89C2\\u5BDF\\u548C\\u8BBF\\u8C08\\u7ED3\\u679C\\u7684\\u7EFC\\u5408\\u5206\\u6790\\u3002\"\n        }\n      }, {\n        page: 5,\n        title: { en: \"Desk Research and Visual Range\", cn: \"\\u6848\\u5934\\u5206\\u6790\\u4E0E\\u89C6\\u91CE\\u8303\\u56F4\" },\n        content: {\n          en: \"Human visual-field references, driver eye movement, and representative passenger-screen layouts establish the viewing-angle and placement assumptions used in the experiment.\",\n          cn: \"\\u901A\\u8FC7\\u4EBA\\u773C\\u89C6\\u91CE\\u8303\\u56F4\\u3001\\u9A7E\\u9A76\\u5458\\u89C6\\u7EBF\\u8FD0\\u52A8\\u548C\\u5178\\u578B\\u526F\\u9A7E\\u5C4F\\u5E03\\u5C40\\u8D44\\u6599\\uFF0C\\u5EFA\\u7ACB\\u5B9E\\u9A8C\\u6240\\u91C7\\u7528\\u7684\\u89C6\\u89D2\\u3001\\u8DDD\\u79BB\\u4E0E\\u5C4F\\u5E55\\u4F4D\\u7F6E\\u524D\\u63D0\\u3002\"\n        }\n      }]\n    }, {\n      title: {\n        en: \"Experiment Preparation\",\n        cn: \"\\u5B9E\\u9A8C\\u73AF\\u5883\\u4E0E\\u9884\\u8BD5\\u9A8C\"\n      },\n      description: {\n        en: \"The simulator environment is assembled first, then a pilot test is used to identify the variables before the seven formal demo conditions are finalized.\",\n        cn: \"\\u5148\\u5B8C\\u6210\\u9A7E\\u9A76\\u6A21\\u62DF\\u73AF\\u5883\\u4E0E\\u8BBE\\u5907\\u642D\\u5EFA\\uFF0C\\u518D\\u901A\\u8FC7\\u9884\\u8BD5\\u9A8C\\u8BC6\\u522B\\u5173\\u952E\\u53D8\\u91CF\\uFF0C\\u6700\\u540E\\u5F62\\u6210\\u4E03\\u7EC4\\u6B63\\u5F0F\\u5B9E\\u9A8C Demo\\u3002\"\n      },\n      pages: [{\n        page: 6,\n        title: { en: \"Environment and Equipment\", cn: \"\\u5B9E\\u9A8C\\u73AF\\u5883\\u4E0E\\u8BBE\\u5907\" },\n        content: {\n          en: \"The setup combines a low-traffic highway simulation, two 15.6-inch displays, a variable-switching computer, video recording equipment, and a screen-position reference based on the Toyota Highlander.\",\n          cn: \"\\u5B9E\\u9A8C\\u73AF\\u5883\\u5305\\u542B\\u4F4E\\u8F66\\u6D41\\u91CF\\u9AD8\\u901F\\u516C\\u8DEF\\u6A21\\u62DF\\u573A\\u666F\\u3001\\u4E24\\u5757 15.6 \\u82F1\\u5BF8\\u5C4F\\u5E55\\u3001\\u53D8\\u91CF\\u5207\\u6362\\u7535\\u8111\\u4E0E\\u89C6\\u9891\\u8BB0\\u5F55\\u8BBE\\u5907\\uFF0C\\u5E76\\u53C2\\u8003\\u6C49\\u5170\\u8FBE\\u7684\\u526F\\u9A7E\\u5C4F\\u4F4D\\u7F6E\\u8FDB\\u884C\\u5E03\\u7F6E\\u3002\"\n        }\n      }, {\n        page: 7,\n        title: { en: \"Pilot Test\", cn: \"\\u9884\\u8BD5\\u9A8C\" },\n        content: {\n          en: \"The pilot test compares early screen layouts and image conditions. It identifies position and frame size as the primary variables, while color, brightness, motion frequency, trajectory, and content are controlled as interference factors.\",\n          cn: \"\\u9884\\u8BD5\\u9A8C\\u5BF9\\u65E9\\u671F\\u5C4F\\u5E55\\u4F4D\\u7F6E\\u548C\\u5F71\\u50CF\\u6761\\u4EF6\\u8FDB\\u884C\\u6BD4\\u8F83\\uFF0C\\u786E\\u8BA4\\u4F4D\\u7F6E\\u4E0E\\u753B\\u5E45\\u5927\\u5C0F\\u4E3A\\u4E3B\\u8981\\u5B9E\\u9A8C\\u53D8\\u91CF\\uFF0C\\u540C\\u65F6\\u63A7\\u5236\\u8272\\u5F69\\u53D8\\u5316\\u3001\\u4EAE\\u5EA6\\u3001\\u53D8\\u52A8\\u9891\\u7387\\u3001\\u8FD0\\u52A8\\u8F68\\u8FF9\\u548C\\u5F71\\u50CF\\u5185\\u5BB9\\u7B49\\u5E72\\u6270\\u56E0\\u7D20\\u3002\"\n        }\n      }, {\n        page: 8,\n        title: { en: \"Formal Demo Conditions\", cn: \"\\u6B63\\u5F0F\\u5B9E\\u9A8C Demo \\u8BBE\\u8BA1\" },\n        content: {\n          en: \"Seven conditions, A, B, C, D, B1, C1, and D1, are defined to compare image position and scale while keeping the remaining visual content consistent.\",\n          cn: \"\\u6B63\\u5F0F\\u5B9E\\u9A8C\\u8BBE\\u7F6E A\\u3001B\\u3001C\\u3001D\\u3001B1\\u3001C1\\u3001D1 \\u4E03\\u7EC4\\u6761\\u4EF6\\uFF0C\\u5728\\u4FDD\\u6301\\u5176\\u4F59\\u5F71\\u50CF\\u5185\\u5BB9\\u4E00\\u81F4\\u7684\\u524D\\u63D0\\u4E0B\\uFF0C\\u5BF9\\u6BD4\\u4F4D\\u7F6E\\u4E0E\\u753B\\u5E45\\u5927\\u5C0F\\u7684\\u5F71\\u54CD\\u3002\"\n        }\n      }]\n    }, {\n      title: {\n        en: \"Participants and Procedure\",\n        cn: \"\\u88AB\\u8BD5\\u4E0E\\u6B63\\u5F0F\\u5B9E\\u9A8C\\u6D41\\u7A0B\"\n      },\n      description: {\n        en: \"Participant characteristics, viewing distance, the test sequence, and the on-site record are documented before analysis begins.\",\n        cn: \"\\u5728\\u8FDB\\u5165\\u6570\\u636E\\u5206\\u6790\\u524D\\uFF0C\\u7814\\u7A76\\u4F9D\\u6B21\\u8BB0\\u5F55\\u88AB\\u8BD5\\u6784\\u6210\\u3001\\u89C2\\u770B\\u8DDD\\u79BB\\u3001\\u6B63\\u5F0F\\u6D4B\\u8BD5\\u6B65\\u9AA4\\u4E0E\\u73B0\\u573A\\u6267\\u884C\\u60C5\\u51B5\\u3002\"\n      },\n      pages: [{\n        page: 9,\n        title: { en: \"Participant Profile\", cn: \"\\u88AB\\u8BD5\\u4FE1\\u606F\" },\n        content: {\n          en: \"Twenty licensed drivers participated: 14 men and 6 women aged 24\\u201339, with an average of 7.1 years of driving experience. The average vertical viewing distance was 67 cm.\",\n          cn: \"\\u5B9E\\u9A8C\\u9080\\u8BF7 20 \\u4F4D\\u6301\\u6709\\u6548\\u9A7E\\u7167\\u7684\\u88AB\\u8BD5\\uFF0C\\u5305\\u62EC\\u7537\\u6027 14 \\u4F4D\\u3001\\u5973\\u6027 6 \\u4F4D\\uFF0C\\u5E74\\u9F84\\u4E3A 24\\u201339 \\u5C81\\uFF0C\\u5E73\\u5747\\u9A7E\\u9F84 7.1 \\u5E74\\uFF1B\\u5E73\\u5747\\u5782\\u76F4\\u89C6\\u8DDD\\u4E3A 67cm\\u3002\"\n        }\n      }, {\n        page: 10,\n        title: { en: \"Procedure and Recording\", cn: \"\\u5B9E\\u9A8C\\u6D41\\u7A0B\\u4E0E\\u8BB0\\u5F55\\u65B9\\u5F0F\" },\n        content: {\n          en: \"Participants receive a briefing, complete basic information, adapt to the simulator, drive steadily at 60\\u201380 km/h, experience each two-minute demo, and then complete subjective questionnaires and interviews. Attention-attraction counts are recorded alongside the self-reported data.\",\n          cn: \"\\u6D41\\u7A0B\\u5305\\u62EC\\u5B9E\\u9A8C\\u8BF4\\u660E\\u3001\\u57FA\\u7840\\u4FE1\\u606F\\u586B\\u5199\\u3001\\u6A21\\u62DF\\u5668\\u9002\\u5E94\\u3001\\u4EE5 60\\u201380km/h \\u7A33\\u5B9A\\u9A7E\\u9A76\\u3001\\u6BCF\\u7EC4\\u4E24\\u5206\\u949F Demo \\u6D4B\\u8BD5\\u3001\\u4E3B\\u89C2\\u95EE\\u5377\\u4E0E\\u8BBF\\u8C08\\uFF1B\\u540C\\u65F6\\u8BB0\\u5F55\\u6CE8\\u610F\\u529B\\u88AB\\u5438\\u5F15\\u7684\\u6B21\\u6570\\uFF0C\\u7528\\u4E8E\\u548C\\u4E3B\\u89C2\\u8BC4\\u5206\\u4EA4\\u53C9\\u9A8C\\u8BC1\\u3002\"\n        }\n      }, {\n        page: 11,\n        title: { en: \"Field Record\", cn: \"\\u5B9E\\u9A8C\\u73B0\\u573A\\u8BB0\\u5F55\" },\n        content: {\n          en: \"The field documentation shows the consistent simulator setup, participant posture, display placement, and recording process used throughout the formal experiment.\",\n          cn: \"\\u73B0\\u573A\\u8BB0\\u5F55\\u5C55\\u793A\\u6B63\\u5F0F\\u5B9E\\u9A8C\\u4E2D\\u4FDD\\u6301\\u4E00\\u81F4\\u7684\\u6A21\\u62DF\\u5668\\u73AF\\u5883\\u3001\\u88AB\\u8BD5\\u5750\\u59FF\\u3001\\u526F\\u9A7E\\u5C4F\\u4F4D\\u7F6E\\u4E0E\\u62CD\\u6444\\u8BB0\\u5F55\\u8FC7\\u7A0B\\u3002\"\n        }\n      }]\n    }, {\n      title: {\n        en: \"Subjective Ratings and Statistics\",\n        cn: \"\\u4E3B\\u89C2\\u8BC4\\u5206\\u4E0E\\u7EDF\\u8BA1\\u5206\\u6790\"\n      },\n      description: {\n        en: \"The questionnaire dataset is summarized first, followed by condition-level comparison and statistical testing.\",\n        cn: \"\\u5148\\u8BF4\\u660E\\u5B9E\\u9A8C\\u6570\\u636E\\u89C4\\u6A21\\uFF0C\\u518D\\u4F9D\\u6B21\\u5448\\u73B0\\u5404\\u5B9E\\u9A8C\\u6761\\u4EF6\\u7684\\u4E3B\\u89C2\\u8BC4\\u5206\\u6BD4\\u8F83\\u4E0E\\u7EDF\\u8BA1\\u663E\\u8457\\u6027\\u68C0\\u9A8C\\u3002\"\n      },\n      pages: [{\n        page: 13,\n        title: { en: \"Dataset Overview\", cn: \"\\u5B9E\\u9A8C\\u6570\\u636E\\u603B\\u89C8\" },\n        content: {\n          en: \"The dataset includes 20 participants, 280 subjective-rating records, 140 attention-count records, 140 interview records, and approximately 600 minutes of experiment footage.\",\n          cn: \"\\u6570\\u636E\\u96C6\\u5305\\u542B 20 \\u4F4D\\u88AB\\u8BD5\\u3001280 \\u6761\\u4E3B\\u89C2\\u8BC4\\u5206\\u3001140 \\u6761\\u6CE8\\u610F\\u529B\\u6B21\\u6570\\u8BB0\\u5F55\\u3001140 \\u6761\\u8BBF\\u8C08\\u8BB0\\u5F55\\uFF0C\\u4EE5\\u53CA\\u7EA6 600 \\u5206\\u949F\\u5B9E\\u9A8C\\u5F71\\u50CF\\u3002\"\n        }\n      }, {\n        page: 14,\n        title: { en: \"Subjective Attention Ratings\", cn: \"\\u6CE8\\u610F\\u529B\\u5F71\\u54CD\\u4E3B\\u89C2\\u8BC4\\u5206\" },\n        content: {\n          en: \"Scores for A through D1 are organized by participant and averaged by condition, establishing the first comparison of how strongly each screen arrangement affected attention.\",\n          cn: \"A \\u81F3 D1 \\u4E03\\u7EC4\\u6761\\u4EF6\\u7684\\u8BC4\\u5206\\u4EE5\\u88AB\\u8BD5\\u4E3A\\u5355\\u4F4D\\u5206\\u6790\\uFF0C\\u5E76\\u8BA1\\u7B97\\u5404\\u7EC4\\u5E73\\u5747\\u503C\\uFF0C\\u5F62\\u6210\\u4E0D\\u540C\\u5C4F\\u5E55\\u5E03\\u5C40\\u5BF9\\u6CE8\\u610F\\u529B\\u5F71\\u54CD\\u7A0B\\u5EA6\\u7684\\u7B2C\\u4E00\\u8F6E\\u6BD4\\u8F83\\u3002\"\n        }\n      }, {\n        page: 15,\n        title: { en: \"Rating Distribution\", cn: \"\\u4E3B\\u89C2\\u8BC4\\u5206\\u5206\\u5E03\\u5206\\u6790\" },\n        content: {\n          en: \"The score distribution is compared across image positions and sizes, revealing which conditions were more frequently perceived as distracting.\",\n          cn: \"\\u8FDB\\u4E00\\u6B65\\u6BD4\\u8F83\\u4E0D\\u540C\\u5F71\\u50CF\\u4F4D\\u7F6E\\u4E0E\\u753B\\u5E45\\u5927\\u5C0F\\u7684\\u8BC4\\u5206\\u5206\\u5E03\\uFF0C\\u8BC6\\u522B\\u54EA\\u4E9B\\u6761\\u4EF6\\u66F4\\u5BB9\\u6613\\u88AB\\u88AB\\u8BD5\\u611F\\u77E5\\u4E3A\\u5E72\\u6270\\u9A7E\\u9A76\\u6CE8\\u610F\\u529B\\u3002\"\n        }\n      }, {\n        page: 16,\n        title: { en: \"Statistical Significance\", cn: \"\\u7EDF\\u8BA1\\u5B66\\u663E\\u8457\\u6027\\u5206\\u6790\" },\n        content: {\n          en: \"ANOVA and LSD comparisons test whether the observed differences between conditions are statistically meaningful rather than the result of isolated subjective variation.\",\n          cn: \"\\u901A\\u8FC7 ANOVA \\u4E0E LSD \\u6BD4\\u8F83\\u68C0\\u9A8C\\u5404\\u7EC4\\u5DEE\\u5F02\\u662F\\u5426\\u5177\\u6709\\u7EDF\\u8BA1\\u610F\\u4E49\\uFF0C\\u907F\\u514D\\u4EC5\\u51ED\\u4E2A\\u522B\\u88AB\\u8BD5\\u7684\\u4E3B\\u89C2\\u611F\\u53D7\\u5F97\\u51FA\\u7ED3\\u8BBA\\u3002\"\n        }\n      }]\n    }, {\n      title: {\n        en: \"Observed Attention and Interviews\",\n        cn: \"\\u6CE8\\u610F\\u529B\\u8BB0\\u5F55\\u4E0E\\u8BBF\\u8C08\\u53CD\\u9988\"\n      },\n      description: {\n        en: \"Observed attention-attraction counts are compared with questionnaire scores, then qualitative interviews explain the factors behind those patterns.\",\n        cn: \"\\u5C06\\u89C2\\u5BDF\\u5230\\u7684\\u6CE8\\u610F\\u529B\\u5438\\u5F15\\u6B21\\u6570\\u4E0E\\u95EE\\u5377\\u8BC4\\u5206\\u8FDB\\u884C\\u5BF9\\u7167\\uFF0C\\u518D\\u901A\\u8FC7\\u8BBF\\u8C08\\u89E3\\u91CA\\u8FD9\\u4E9B\\u6570\\u636E\\u6A21\\u5F0F\\u80CC\\u540E\\u7684\\u5177\\u4F53\\u539F\\u56E0\\u3002\"\n      },\n      pages: [{\n        page: 17,\n        title: { en: \"Attention Counts and Correlation\", cn: \"\\u6CE8\\u610F\\u529B\\u5438\\u5F15\\u6B21\\u6570\\u4E0E\\u76F8\\u5173\\u6027\" },\n        content: {\n          en: \"Attention-attraction counts and subjective scores show a Pearson correlation coefficient of 0.967 with P < 0.001, providing a strong consistency check between observed behavior and self-reported impact.\",\n          cn: \"\\u6CE8\\u610F\\u529B\\u5438\\u5F15\\u6B21\\u6570\\u4E0E\\u4E3B\\u89C2\\u8BC4\\u5206\\u5E73\\u5747\\u503C\\u7684\\u76AE\\u5C14\\u900A\\u76F8\\u5173\\u7CFB\\u6570\\u4E3A 0.967\\uFF0CP\\uFF1C0.001\\uFF0C\\u8BF4\\u660E\\u89C2\\u5BDF\\u884C\\u4E3A\\u4E0E\\u4E3B\\u89C2\\u5F71\\u54CD\\u8BC4\\u4EF7\\u4E4B\\u95F4\\u5177\\u6709\\u9AD8\\u5EA6\\u4E00\\u81F4\\u6027\\u3002\"\n        }\n      }, {\n        page: 18,\n        title: { en: \"Interview Feedback Matrix\", cn: \"\\u8BBF\\u8C08\\u53CD\\u9988\\u7ED3\\u679C\\u603B\\u8868\" },\n        content: {\n          en: \"Interview statements are coded across factors including vertical and horizontal placement, image size, content, sound, motion trajectory, rear-view-mirror conflict, and road conditions.\",\n          cn: \"\\u8BBF\\u8C08\\u5185\\u5BB9\\u6309\\u7167\\u4E0A\\u4E0B\\u4F4D\\u7F6E\\u3001\\u5DE6\\u53F3\\u4F4D\\u7F6E\\u3001\\u5F71\\u50CF\\u5C3A\\u5BF8\\u3001\\u5F71\\u50CF\\u5185\\u5BB9\\u3001\\u58F0\\u97F3\\u3001\\u8FD0\\u52A8\\u8F68\\u8FF9\\u3001\\u540E\\u89C6\\u955C\\u51B2\\u7A81\\u4E0E\\u9053\\u8DEF\\u72B6\\u51B5\\u7B49\\u56E0\\u7D20\\u8FDB\\u884C\\u7F16\\u7801\\u5206\\u6790\\u3002\"\n        }\n      }, {\n        page: 19,\n        title: { en: \"Interview Synthesis\", cn: \"\\u8BBF\\u8C08\\u5173\\u952E\\u8BCD\\u4E0E\\u8865\\u5145\\u8DDF\\u8BBF\" },\n        content: {\n          en: \"Keyword clustering and follow-up questions turn the interview matrix into a more focused explanation of why particular positions and visual behaviors attracted attention.\",\n          cn: \"\\u901A\\u8FC7\\u5173\\u952E\\u8BCD\\u805A\\u7C7B\\u4E0E\\u7279\\u6B8A\\u95EE\\u9898\\u8DDF\\u8BBF\\uFF0C\\u5C06\\u8BBF\\u8C08\\u603B\\u8868\\u8FDB\\u4E00\\u6B65\\u8F6C\\u5316\\u4E3A\\u5BF9\\u7279\\u5B9A\\u4F4D\\u7F6E\\u548C\\u89C6\\u89C9\\u884C\\u4E3A\\u4E3A\\u4F55\\u5438\\u5F15\\u6CE8\\u610F\\u529B\\u7684\\u96C6\\u4E2D\\u89E3\\u91CA\\u3002\"\n        }\n      }]\n    }, {\n      title: {\n        en: \"Conclusions and Recommendations\",\n        cn: \"\\u5B9E\\u9A8C\\u7ED3\\u8BBA\\u4E0E\\u8BBE\\u8BA1\\u5EFA\\u8BAE\"\n      },\n      description: {\n        en: \"The final stage consolidates the attention-impact pattern and translates the findings into passenger-screen layout recommendations.\",\n        cn: \"\\u6700\\u540E\\u5C06\\u6CE8\\u610F\\u529B\\u5F71\\u54CD\\u89C4\\u5F8B\\u6C47\\u603B\\u4E3A\\u7ED3\\u8BBA\\uFF0C\\u5E76\\u8FDB\\u4E00\\u6B65\\u8F6C\\u5316\\u4E3A\\u526F\\u9A7E\\u5C4F\\u5F71\\u50CF\\u4F4D\\u7F6E\\u4E0E\\u5E03\\u5C40\\u5EFA\\u8BAE\\u3002\"\n      },\n      pages: [{\n        page: 21,\n        title: { en: \"Experiment Conclusions\", cn: \"\\u5B9E\\u9A8C\\u7ED3\\u8BBA\" },\n        content: {\n          en: \"The conclusion maps the relative attention impact of the tested conditions, identifies critical placement and size relationships, and summarizes the main findings from the experiment.\",\n          cn: \"\\u7ED3\\u8BBA\\u6C47\\u603B\\u4E03\\u7EC4\\u6761\\u4EF6\\u7684\\u76F8\\u5BF9\\u6CE8\\u610F\\u529B\\u5F71\\u54CD\\uFF0C\\u8BC6\\u522B\\u5F71\\u50CF\\u4F4D\\u7F6E\\u4E0E\\u753B\\u5E45\\u5927\\u5C0F\\u7684\\u5173\\u952E\\u5173\\u7CFB\\uFF0C\\u5E76\\u96C6\\u4E2D\\u5448\\u73B0\\u5B9E\\u9A8C\\u7684\\u4E3B\\u8981\\u53D1\\u73B0\\u3002\"\n        }\n      }, {\n        page: 22,\n        title: { en: \"Additional Layout Recommendations\", cn: \"\\u5176\\u4ED6\\u5E03\\u5C40\\u5EFA\\u8BAE\" },\n        content: {\n          en: \"The findings are translated into practical layout guidance and compared with representative passenger-screen configurations already used in production vehicles.\",\n          cn: \"\\u7814\\u7A76\\u7ED3\\u679C\\u88AB\\u8F6C\\u5316\\u4E3A\\u66F4\\u5177\\u4F53\\u7684\\u5E03\\u5C40\\u5EFA\\u8BAE\\uFF0C\\u5E76\\u4E0E\\u5E02\\u9762\\u91CF\\u4EA7\\u8F66\\u578B\\u4E2D\\u7684\\u5178\\ r neutral; it is directional, competitive, and unevenly allocated.\",\n        cn: \"装置把简单却不平等的规则可视化：投入越多，期待得到的也越多。当更多玩家加入后，分配会变得不稳定且明显偏向，因为指针会向更快的输入者一侧倾斜。反馈不再是中性的，它具有方向性、竞争性，也并不平均。\"\n      },\n      motion: [\n        { src: \"assets/portfolio/coins-in-the-sky/motion-single-fast.gif\", alt: { en: \"Single-player fast input motion\", cn: \"\\u5355\\u4EBA\\u5FEB\\u901F\\u8F93\\u5165\\u52A8\\u56FE\" } },\n        { src: \"assets/portfolio/coins-in-the-sky/motion-single-slow.gif\", alt: { en: \"Single-player slow input motion\", cn: \"\\u5355\\u4EBA\\u6162\\u901F\\u8F93\\u5165\\u52A8\\u56FE\" } },\n        { src: \"assets/portfolio/coins-in-the-sky/motion-coin-payout.gif\", alt: { en: \"Multi-player competition motion\", cn: \"\\u591A\\u4EBA\\u7ADE\\u4E89\\u52A8\\u56FE\" } },\n        { src: \"assets/portfolio/coins-in-the-sky/motion-pointer-spin.gif\", alt: { en: \"Pointer swing motion\", cn: \"\\u6307\\u9488\\u504F\\u8F6C\\u52A8\\u56FE\" } },\n        { src: \"assets/portfolio/coins-in-the-sky/motion-coin-payout.gif\", alt: { en: \"Coin payout motion\", cn: \"\\u786C\\u5E01\\u56DE\\u62A5\\u52A8\\u56FE\" } }\n      ]\n    }, {\n      key: \"promises\",\n      title: { en: \"Promises of Return\", cn: \"\\u56DE\\u62A5\\u60F3\\u8C61\\u7684\\u56DB\\u4E2A\\u7EF4\\u5EA6\" },\n      content: {\n        en: \"The project borrows from the \\u201Cpie in the sky\\u201D effect: people continue over-investing because future return still feels possible. That return may be imagined as survival, social connection, life meaning, or self-actualization. These promises motivate continued effort even when the distribution remains irrational.\",\n        cn: \"\\u9879\\u76EE\\u501F\\u7528\\u4E86\\u201Cpie in the sky\\u201D\\u6548\\u5E94\\uFF1A\\u5373\\u4F7F\\u56DE\\u62A5\\u5206\\u914D\\u5E76\\u4E0D\\u5408\\u7406\\uFF0C\\u4EBA\\u4EEC\\u4F9D\\u7136\\u4F1A\\u6301\\u7EED\\u8FC7\\u5EA6\\u6295\\u5165\\uFF0C\\u56E0\\u4E3A\\u672A\\u6765\\u7684\\u56DE\\u62A5\\u4ECD\\u7136\\u770B\\u4F3C\\u53EF\\u80
